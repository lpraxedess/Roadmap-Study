name: Validar portal IAM
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validacao:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar HTML, scripts e currículo
        run: node scripts/validate.mjs
