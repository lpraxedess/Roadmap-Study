name: Validar ROADMAP - IAM
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check assets/app.js
          node --check data/catalog.js
          node --check data/expanded.js
          node --check data/learning.js
          node --check data/company-lab.js
          node --check data/topic-practice.js
          node --check data/didactics.js
          node --check assets/experience.js
          node --check assets/v3.js
          node --check data/lab-courses.js
          node --check assets/lab-platform.js
      - name: Validar currículo e referências
        run: node --test tests/*.test.mjs

      - name: Testar API SCIM local (stdlib Python)
        run: |
          python3 -m py_compile labs/local/scim_server.py labs/local/oidc_app.py
          python3 -m unittest discover -s labs/local/tests -p 'test_*.py'
      - name: Preparar testes de navegador real
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --with-deps
      - name: Testar navegação, progresso e backup no Chromium
        run: npm run test:browser
