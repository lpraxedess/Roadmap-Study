name: Build and publish IAM Academy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static site dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Test JML script
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Build visual site
        run: python site/build.py
      - name: Validate generated site
        run: python site/check_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: iam-academy-site
          path: dist
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - uses: actions/download-artifact@v4
        with:
          name: iam-academy-site
          path: dist
      - name: Publish to gh-pages
        run: ghp-import -n -p -f dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
