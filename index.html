const code=command.closest('.atlas-env-command')?.querySelector('code')?.textContent;if(!code)return;
if(navigator.clipboard?.writeText){navigator.clipboard.writeText(code).then(()=>{command.textContent='✓ Copiado';setTimeout(()=>command.innerHTML=atlasIcon('check')+' Copiar',1800)}).catch(()=>alert('Copie o comando selecionando o texto.'))}else{alert('Selecione e copie o comando manualmente.')}
return;
}
const toggle=e.target.closest('[data-env-toggle]');if(toggle){const index=Number(toggle.dataset.envToggle),section=toggle.closest('.atlas-env-stage');if(section.classList.contains('is-open')){section.classList.remove('is-open');toggle.setAttribute('aria-expanded','false')}else atlasEnvOpen(index);return}
const nextStage=e.target.closest('[data-env-next]');if(nextStage){atlasEnvOpen(Number(nextStage.dataset.envNext),true);return}
const filterButton=e.target.closest('[data-topic-filter]');if(filterButton){topicFilter=filterButton.dataset.topicFilter;document.querySelectorAll('[data-topic-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filterButton)));drawTopics();return}const toggle=e.target.closest('[data-expand-topic]');if(toggle){const shell=toggle.closest('.topic-shell'),old=document.querySelector('.topic-shell.is-open');if(old&&old!==shell){old.classList.remove('is-open');old.querySelector('.topic').setAttribute('aria-expanded','false');old.querySelector('.topic-panel').classList.remove('expanded')}const open=shell.classList.toggle('is-open');toggle.setAttribute('aria-expanded',String(open));shell.querySelector('.topic-panel').classList.toggle('expanded',open);return}const complete=e.target.closest('[data-complete-topic]');if(complete){const id=complete.dataset.completeTopic;completed.has(id)?completed.delete(id):completed.add(id);localStorage.setItem(KEY,JSON.stringify([...completed]));complete.textContent=completed.has(id)?'✓ Concluído · Desmarcar':'Marcar como concluído';complete.closest('.topic-shell').querySelector('.topic-indicator').textContent=completed.has(id)?'✓':'＋';return}const page=e.target.closest('[data-page]');if(page){if(location.hash!=='#'+page.dataset.page)location.hash=page.dataset.page;else render();return}const item=e.target.closest('[data-kind]');if(item)open(item.dataset.kind,Number(item.dataset.id));if(e.target.closest('[data-stage]')){const b=e.target.closest('[data-stage]');drawCerts(b.getAttribute('aria-expanded')==='true'?'':b.dataset.stage)}if(e.target.id==='mark'){const id=e.target.dataset.item;completed.has(id)?completed.delete(id):completed.add(id);localStorage.setItem(KEY,JSON.stringify([...completed]));dialog.close();render()}if(e.target.id==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify({app:'iam-atlas',version:2,completed:[...completed],checklists:atlasChecklist},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='iam-atlas-progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(e.target.id==='import')document.getElementById('file').click();if(e.target.id==='reset'&&confirm('Apagar todas as marcações e checklists de estudo deste navegador?')){completed.clear();atlasChecklist={};localStorage.setItem(KEY,'[]');localStorage.removeItem(ATLAS_CHECKLIST_KEY);render()}});
document.addEventListener('change',async e=>{const step=e.target.closest('[data-atlas-step-id]');if(step){const id=step.dataset.atlasStepId,index=step.dataset.atlasStep;const existing=atlasChecklist[id]||{};existing[index]=step.checked;atlasChecklist[id]=existing;localStorage.setItem(ATLAS_CHECKLIST_KEY,JSON.stringify(atlasChecklist));const counter=document.querySelector('[data-atlas-step-count="'+id+'"]');if(counter){const total=document.querySelectorAll('[data-atlas-step-id="'+id+'"]').length;counter.textContent=atlasStepCount(id)+' de '+total+' etapas praticadas'}if(id.startsWith('env')){const n=Number(id.slice(3)),stage=window.IAMAtlasCurriculum.environment.stages[n],p=atlasLabProgress(stage,n),section=document.getElementById('env-stage-'+n);if(section){section.querySelector('.atlas-env-status>span:first-child').textContent=p.count+'/'+p.total+' tarefas';section.querySelector('.atlas-env-mini-track i').style.width=p.pct+'%';section.querySelector('[data-env-counter]').textContent=p.count+' de '+p.total+' tarefas realizadas'}const totalSteps=window.IAMAtlasCurriculum.environment.stages.reduce((a,t)=>a+t.steps.length,0),doneSteps=window.IAMAtlasCurriculum.environment.stages.reduce((a,t,i)=>a+atlasLabProgress(t,i).count,0),summary=document.querySelector('.atlas-env-summary');if(summary){summary.querySelector('strong').textContent=Math.round(100*doneSteps/totalSteps)+'%';summary.querySelector('.atlas-compact-track i').style.width=Math.round(100*doneSteps/totalSteps)+'%';summary.querySelector('span').textContent=doneSteps+' de '+totalSteps+' tarefas'}}return}if(e.target.id==='file'){try{const f=e.target.files[0];if(!f||f.size>100000)throw Error('Arquivo inválido');const data=JSON.parse(await f.text());if(data.app!=='iam-atlas'||!Array.isArray(data.completed)||!data.completed.every(x=>ids.includes(x)))throw Error('Formato incompatível');if(confirm('Substituir o progresso atual?')){completed=new Set(data.completed);localStorage.setItem(KEY,JSON.stringify([...completed]));if(data.checklists&&typeof data.checklists==='object'&&!Array.isArray(data.checklists)){atlasChecklist=Object.fromEntries(Object.entries(data.checklists).filter(([id,steps])=>(ids.includes(id)||/^env\d{1,2}$/.test(id)&&Number(id.slice(3))<window.IAMAtlasCurriculum.environment.stages.length)&&steps&&typeof steps==='object'&&!Array.isArray(steps)).map(([id,steps])=>[id,Object.fromEntries(Object.entries(steps).filter(([k,v])=>/^[0-9]{1,2}$/.test(k)&&typeof v==='boolean'))]));localStorage.setItem(ATLAS_CHECKLIST_KEY,JSON.stringify(atlasChecklist))}else{atlasChecklist={};localStorage.removeItem(ATLAS_CHECKLIST_KEY)}render()}}catch(err){alert('Falha ao importar: '+err.message)}}});
document.getElementById('close').onclick=()=>dialog.close();document.addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--px',(e.clientX-r.left)+'px');c.style.setProperty('--py',(e.clientY-r.top)+'px')},{passive:true});let transitionTimer=0;function transitionPage(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){render();return}clearTimeout(transitionTimer);app.classList.add('is-leaving');transitionTimer=setTimeout(()=>{app.classList.remove('is-leaving');render();window.scrollTo({top:0,behavior:'instant'})},175)}window.addEventListener('hashchange',transitionPage);render();
