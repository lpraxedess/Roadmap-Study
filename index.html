<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Plataforma didática de carreira em IAM"><title>IAM Atlas | Roadmap de carreira</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eef8;background:#090e16;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:#84bafa}aside{position:fixed;inset:0 auto 0 0;width:245px;background:#101826;border-right:1px solid #243146;padding:28px 18px;display:flex;flex-direction:column;gap:10px}aside strong{font-size:22px;letter-spacing:-.7px;padding:10px 12px 26px}aside button{border:0;background:none;color:#98a8bf;text-align:left;padding:12px 14px;border-radius:11px}aside button.active,aside button:hover{background:#1b2b41;color:#e9f4ff}aside small{margin-top:auto;color:#788ba6;line-height:1.6}main{max-width:1270px;margin-left:245px;padding:44px clamp(18px,4vw,65px) 90px}h1{font-size:clamp(2rem,3.6vw,3.4rem);letter-spacing:-.055em;margin:8px 0 16px;line-height:1.12}h2{font-size:1.4rem;letter-spacing:-.035em}h3{margin:9px 0;font-size:1.08rem}p{color:#a6b6ce;line-height:1.75}header{margin-bottom:35px}.eyebrow{color:#60c6bf;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.lead{max-width:760px;font-size:1.06rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px;margin:24px 0 30px}.card{background:#111b2b;border:1px solid #28374b;border-radius:17px;padding:22px;min-width:0}.card p{font-size:14px}.card button,.primary{border:1px solid #416f8b;background:#17384a;color:#c4f1ef;padding:10px 13px;border-radius:9px}.card button:hover,.primary:hover{background:#24516a}.tag{display:inline-block;font-size:11px;color:#79d5bf;border:1px solid #255e65;border-radius:20px;padding:4px 9px;margin-right:6px}.muted{color:#93a3bc}.number{font-size:31px;font-weight:800}.meter{height:7px;border-radius:8px;background:#2a3646;overflow:hidden;margin:15px 0}.meter span{height:100%;display:block;background:#56c6ad}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.list{display:grid;gap:12px}.topic{display:flex;align-items:center;justify-content:space-between;gap:15px;width:100%;text-align:left;background:#111b2b;color:inherit;border:1px solid #29384d;border-radius:11px;padding:18px}.topic:hover{border-color:#58afaa}.topic small{display:block;color:#a0b0c8;margin-top:6px}.check{color:#55c8aa}.filter{background:#101a27;border:1px solid #334359;border-radius:10px;color:#d7e4f9;padding:12px;width:100%;max-width:470px;margin:8px 0 22px}dialog{max-width:650px;width:calc(100% - 30px);border:1px solid #405672;border-radius:18px;padding:30px;background:#101b2b;color:#e9eef8;max-height:86vh;overflow:auto}dialog::backdrop{background:#000a}dialog li{margin:12px 0;color:#b9c8de;line-height:1.6}.dialog-close{float:right;background:transparent;color:white;border:0;font-size:23px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.toolbar button{background:#192c3d;color:#d7f3ff;border:1px solid #38536a;padding:11px 16px;border-radius:10px}footer{color:#72829d;font-size:12px;margin-top:65px}.note{padding:19px;border-left:3px solid #53b6a6;background:#132535;border-radius:8px;margin:25px 0}.empty{padding:30px;color:#9caac0}@media(max-width:760px){aside{position:relative;width:auto;inset:auto;display:block;padding:18px}aside strong{display:block;padding:0 0 15px}aside button{display:inline-block;padding:9px;font-size:12px}aside small{display:none}main{margin:0;padding:25px 17px 60px}} .cert-layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px}.cert-side{display:flex;flex-direction:column;gap:9px}.cert-level{background:#111b2b;color:#b9cce2;border:1px solid #304158;border-radius:11px;padding:16px;text-align:left}.cert-level.selected{background:#19434b;color:#eafff9;border-color:#63c2b5}@media(max-width:760px){.cert-layout{grid-template-columns:1fr}.cert-side{flex-direction:row}.cert-level{flex:1;padding:12px}} </style></head><body><aside><strong>◈ IAM Atlas</strong><button data-page="inicio">Visão geral</button><button data-page="roadmap">Roadmap</button><button data-page="labs">Laboratórios</button><button data-page="certs">Certificações</button><button data-page="progresso">Meu progresso</button><small>Projeto educacional independente.<br>Progresso armazenado apenas neste navegador.</small></aside><main id="app"></main><dialog id="detail"><button class="dialog-close" id="close" aria-label="Fechar">×</button><div id="detail-body"></div></dialog><script>
const levels=['Fundamentos de TI','Fundamentos de IAM','Protocolos e integrações','Operações e governança','Segurança avançada','Arquitetura e automação'];
const topics=[
['Fundamentos de redes','Entenda TCP/IP, DNS, HTTP e TLS.','Explique a diferença entre resolução DNS, conexão TCP e conexão TLS.','https://developer.mozilla.org/pt-BR/docs/Web/HTTP'],
['Linux e Windows Server','Conheça sistemas, contas, serviços, logs e permissões.','Crie uma VM de laboratório e documente usuários, grupos e permissões.','https://learn.microsoft.com/pt-br/windows-server/'],
['Diretórios e LDAP','Estude objetos, atributos, hierarquia, bind e consultas LDAP.','Desenhe a estrutura de um diretório de identidades fictício.','https://learn.microsoft.com/pt-br/windows/win32/ad/active-directory-domain-services'],
['Ciclo de vida da identidade','Aprenda Joiner, Mover, Leaver (JML), provisionamento e desprovisionamento.','Descreva um fluxo de admissão, movimentação e desligamento com aprovações.','https://learn.microsoft.com/pt-br/entra/identity-governance/what-is-identity-governance'],
['Autenticação e MFA','Diferencie autenticação, autorização, fatores e resistência a phishing.','Compare senha, TOTP e FIDO2 em uma tabela de riscos e benefícios.','https://pages.nist.gov/800-63-4/'],
['RBAC, ABAC e mínimo privilégio','Compare papéis, atributos, políticas e segregação de funções.','Modele acessos de uma empresa com RH, Financeiro e TI.','https://csrc.nist.gov/projects/attribute-based-access-control'],
['SAML 2.0 e SSO','Entenda IdP, SP, assertions, metadados e fluxo de login federado.','Desenhe uma autenticação SAML, identificando pontos de confiança.','https://learn.microsoft.com/pt-br/entra/identity/enterprise-apps/what-is-single-sign-on'],
['OAuth 2.0 e OpenID Connect','Separe delegação de autorização de autenticação federada.','Diagramar Authorization Code + PKCE e identificar access token e ID token.','https://openid.net/developers/how-connect-works/'],
['SCIM e APIs REST','Aprenda sincronização de usuários, grupos, métodos HTTP e JSON.','Especifique um payload SCIM fictício para entrada de colaborador.','https://www.rfc-editor.org/rfc/rfc7644'],
['Active Directory e Entra ID','Explore AD DS, identidades híbridas, grupos e políticas.','Monte um diagrama com AD local, sincronização e aplicações SaaS.','https://learn.microsoft.com/pt-br/entra/fundamentals/what-is-entra'],
['IGA e revisões de acesso','Entenda campanhas de revisão, solicitações, aprovação e SoD.','Simule uma campanha trimestral de revisão de acesso baseada em risco.','https://learn.microsoft.com/pt-br/entra/id-governance/identity-governance-overview'],
['PAM, PIM e JIT','Estude cofres, elevação temporária, acesso privilegiado e auditoria.','Projete um fluxo de acesso administrativo temporário com justificativa e expiração.','https://learn.microsoft.com/pt-br/entra/id-governance/privileged-identity-management/pim-configure'],
['Zero Trust e identidade','Use sinais de risco, dispositivo, sessão e contexto para decisões.','Desenhe uma política de acesso condicional para uma aplicação crítica.','https://www.nist.gov/publications/zero-trust-architecture'],
['Automação com PowerShell e Graph','Aprenda scripts idempotentes, autenticação de API e logs.','Escreva um pseudocódigo de onboarding com validação e rollback.','https://learn.microsoft.com/pt-br/graph/overview'],
['Arquitetura IAM e métricas','Integre governança, autenticação, PAM, ciclo de vida e observabilidade.','Elabore arquitetura alvo e KPIs: órfãos, tempo de revogação e cobertura MFA.','https://www.nist.gov/identity-access-management']
].map((x,i)=>({id:'t'+i,title:x[0],desc:x[1],practice:x[2],url:x[3],level:Math.floor(i/3)}));
const tracks=[
{name:'IAM Analyst',desc:'Operação, solicitações, revisões e ciclo de vida.',ids:[3,4,5,9,10]},
{name:'IAM Engineer',desc:'SSO, integração de aplicações, diretórios e automação.',ids:[2,4,6,7,8,9,13]},
{name:'IGA Specialist',desc:'Governança, JML, segregação de funções e recertificação.',ids:[3,5,8,10,14]},
{name:'PAM Specialist',desc:'Proteção de credenciais privilegiadas e elevação temporária.',ids:[4,5,11,12,14]},
{name:'IAM Architect',desc:'Arquitetura híbrida, padrões, riscos, governança e estratégia.',ids:[3,5,6,7,10,11,12,13,14]}];
const labs=[
{name:'Laboratório de RBAC',level:'Iniciante',goal:'Criar uma matriz de papéis por departamento.',steps:['Crie três áreas fictícias: RH, Financeiro e TI.','Defina cinco recursos e as ações possíveis.','Atribua papéis, eliminando permissões desnecessárias.','Registre exceções e plano de revisão.'],deliver:'Matriz de permissões e justificativas.'},
{name:'Fluxo Joiner–Mover–Leaver',level:'Iniciante',goal:'Automatizar conceitualmente o ciclo de vida.',steps:['Defina sistemas de origem e destino.','Modele gatilhos de admissão, mudança e saída.','Inclua aprovações, falhas e prazos de revogação.'],deliver:'Fluxograma e matriz RACI.'},
{name:'Federação com OIDC',level:'Intermediário',goal:'Entender o Authorization Code Flow com PKCE.',steps:['Use um provedor e cliente de teste autorizados.','Registre issuer, redirect URI, scopes e state.','Observe códigos, tokens e validações sem expor segredos.'],deliver:'Diagrama explicando cada etapa.'},
{name:'Acesso privilegiado JIT',level:'Intermediário',goal:'Projetar a elevação temporária segura.',steps:['Defina uma função administrativa crítica.','Exija MFA e justificativa antes da ativação.','Inclua expiração, registro e revisão posterior.'],deliver:'Política JIT e evidências fictícias.'},
{name:'Campanha de recertificação',level:'Intermediário',goal:'Simular revisão periódica de acessos.',steps:['Crie identidades e acessos fictícios.','Classifique recursos pelo risco.','Encaminhe revisões para gestores.','Documente remoções e exceções.'],deliver:'Relatório de revisão e KPIs.'},
{name:'Arquitetura Zero Trust',level:'Avançado',goal:'Conceber política baseada em identidade e risco.',steps:['Liste identidades humanas e de serviço.','Mapeie decisões de autenticação e autorização.','Adicione contexto de dispositivo, risco e sessão.','Planeje logs e resposta a incidentes.'],deliver:'Diagrama e decisões arquiteturais.'}
].map((x,i)=>({...x,id:'l'+i}));
const certs=[
{name:'Microsoft SC-300',provider:'Microsoft',desc:'Administração de identidades e acessos no Microsoft Entra.',url:'https://learn.microsoft.com/pt-br/credentials/certifications/identity-and-access-administrator/'},
{name:'Microsoft SC-100',provider:'Microsoft',desc:'Arquitetura de soluções de cibersegurança.',url:'https://learn.microsoft.com/pt-br/credentials/certifications/cybersecurity-architect-expert/'},
{name:'CompTIA Security+',provider:'CompTIA',desc:'Fundamentos amplos de segurança, identidade e controle de acesso.',url:'https://www.comptia.org/certifications/security'},
{name:'CISSP',provider:'ISC2',desc:'Governança e arquitetura de segurança, incluindo IAM.',url:'https://www.isc2.org/certifications/cissp'}
].map((x,i)=>({...x,id:'c'+i}));
const addedTopics=[
['Git, documentação e evidências','Versione seu laboratório e documente arquitetura, decisões e resultados.','Crie README, inventário e registros de configuração.','https://docs.github.com/pt/get-started',0],
['DNS, TLS e PKI','Domine nomes, certificados e cadeias de confiança.','Configure DNS e TLS em rede de laboratório.','https://developer.mozilla.org/en-US/docs/Web/Security/Transport_Layer_Security',0],
['Identidades não humanas','Contas de serviço, segredos e identidades de aplicações.','Inventarie e defina rotação de credenciais técnicas.','https://learn.microsoft.com/en-us/entra/workload-id/workload-identities-overview',3],
['Segurança OAuth e OIDC','PKCE, state, nonce, JWKS e validação de tokens.','Valide os controles do fluxo OIDC em aplicação de testes.','https://www.rfc-editor.org/rfc/rfc9700',2],
['Passkeys e FIDO2','Autenticação resistente a phishing.','Defina política de passkeys e MFA.','https://fidoalliance.org/passkeys/',1],
['Catálogo de acessos e SoD','Owners, direitos e segregação de funções.','Crie catálogo e matriz de conflitos.','https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview',3],
['Break-glass e continuidade','Acesso emergencial, resiliência e auditoria.','Documente procedimento de emergência.','https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access',4],
['Monitoramento de identidade','Logs, eventos e detecção de riscos.','Defina alertas de autenticação e privilégio.','https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-sign-ins',4],
['IaC e DevSecOps','Configuração por código, revisão e rollback.','Versione configurações fictícias e valide alterações.','https://developer.hashicorp.com/terraform/tutorials',5],
['Threat modeling','Mapeamento de ameaças e fronteiras de confiança.','Crie threat model da arquitetura IAM.','https://csrc.nist.gov/pubs/sp/800/207/final',5]
];addedTopics.forEach((x,i)=>topics.push({id:'t'+(15+i),title:x[0],desc:x[1],practice:x[2],url:x[3],level:x[4]}));topics.sort((a,b)=>a.level-b.level);
const labPlan=[
['Inventarie a rede e documente topologia.','Configure DNS e certificados de testes.','Crie VMs, usuários e grupos fictícios.'],
['Modele a fonte de identidades RH.','Defina JML, RBAC e MFA.','Documente políticas e exceções.'],
['Integre aplicação de teste com OIDC e PKCE.','Compare SAML e OIDC.','Modele provisionamento SCIM e falhas.'],
['Crie catálogo e revisão de acessos.','Documente SoD e contas técnicas.','Defina KPIs de governança.'],
['Modele PAM e JIT.','Crie runbook de acesso emergencial.','Defina monitoramento e Zero Trust.'],
['Versione automações sem segredos.','Crie arquitetura alvo e threat model.','Documente recuperação e evidências.']
];
const extraCerts=[
['Microsoft SC-900','Microsoft','Básica','Base recomendada para ecossistema Microsoft','https://learn.microsoft.com/en-us/credentials/certifications/security-compliance-and-identity-fundamentals/'],
['ISC2 CC','ISC2','Básica','Fundamentos complementares de segurança','https://www.isc2.org/certifications/cc'],
['Microsoft AZ-900','Microsoft','Básica','Fundamentos complementares de nuvem','https://learn.microsoft.com/en-us/credentials/certifications/azure-fundamentals/'],
['Microsoft AZ-104','Microsoft','Intermediária','Administração Azure complementar','https://learn.microsoft.com/en-us/credentials/certifications/azure-administrator/'],
['Okta Certifications','Okta','Intermediária','Especialização em plataforma Okta','https://www.okta.com/services/certification/'],
['SailPoint Certifications','SailPoint','Intermediária','Especialização IGA','https://www.sailpoint.com/university/'],
['CyberArk Certifications','CyberArk','Intermediária','Especialização PAM','https://training.cyberark.com/'],
['ISACA CISM','ISACA','Avançada','Governança e gestão de segurança','https://www.isaca.org/credentialing/cism']
];extraCerts.forEach((x,i)=>certs.push({id:'c'+(4+i),name:x[0],provider:x[1],stage:x[2],desc:x[3],url:x[4]}));certs.forEach(c=>{if(!c.stage)c.stage=['Microsoft SC-300'].includes(c.name)?'Intermediária':['Microsoft SC-100','CISSP'].includes(c.name)?'Avançada':'Básica'});
const ids=[...topics,...labs,...certs].map(x=>x.id);const KEY='iam-atlas-v1';let completed=new Set();try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))completed=new Set(data.filter(x=>ids.includes(x)))}catch{}const app=document.getElementById('app'),dialog=document.getElementById('detail');const pct=arr=>arr.length?Math.round(arr.filter(x=>completed.has(x.id)).length/arr.length*100):0;const meter=n=>'<div class="meter"><span style="width:'+n+'%"></span></div>';const head=(k,t,d)=>'<header><span class="eyebrow">'+k+'</span><h1>'+t+'</h1><p class="lead">'+d+'</p></header>';const card=(s)=>'<div class="card">'+s+'</div>';const group=(s)=>'<div class="grid">'+s+'</div>';const heading=(s)=>'<h2>'+s+'</h2>';const st=()=>group(card('<span class="muted">Roadmap concluído</span><div class="number">'+pct(topics)+'%</div>'+meter(pct(topics)))+card('<span class="muted">Tópicos</span><div class="number">'+topics.filter(x=>completed.has(x.id)).length+' / '+topics.length+'</div>')+card('<span class="muted">Laboratórios</span><div class="number">'+labs.filter(x=>completed.has(x.id)).length+' / '+labs.length+'</div>')+card('<span class="muted">Certificações registradas</span><div class="number">'+certs.filter(x=>completed.has(x.id)).length+' / '+certs.length+'</div>'));
function render(){const page=(location.hash.slice(1)||'inicio');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let out='';
if(page==='inicio')out=head('PLATAFORMA EDUCACIONAL','Sua carreira em <span style="color:#62c8bc">Identity & Access Management</span>','Aprenda do zero à arquitetura com fundamentos, atividades práticas, especializações e fontes oficiais. Sua evolução é salva no navegador.')+st()+heading('Como estudar')+group(card('<span class="tag">01 · APRENDA</span><h3>Entenda os fundamentos</h3><p>Leia os objetivos de cada tópico e consulte as fontes recomendadas.</p>')+card('<span class="tag">02 · APLIQUE</span><h3>Resolva laboratórios</h3><p>Transforme os conceitos em diagramas, políticas e documentação de portfólio.</p>')+card('<span class="tag">03 · EVOLUA</span><h3>Meça seu progresso</h3><p>Marque competências concluídas e escolha uma trilha profissional.</p>'))+'<div class="note">Comece pelo roadmap. Os laboratórios devem ser feitos apenas em ambientes autorizados.</div>';
else if(page==='roadmap')out=head('6 NÍVEIS · 25 TÓPICOS','Roadmap completo','Os tópicos constroem progressivamente o mesmo ambiente fictício Atlas Corp. Aplique cada conceito antes de avançar.')+'<input id="search" class="filter" placeholder="Buscar por assunto ou tecnologia..." aria-label="Buscar tópicos"><div id="topic-results"></div>';
else if(page==='labs')out=head('ATLAS CORP · PROJETO CONTÍNUO','Laboratório integrado','Um único ambiente de laboratório cresce com os seis níveis do roadmap. Mantenha rede isolada, dados fictícios e documentação versionada.')+group(levels.map((l,i)=>card('<span class="tag">ETAPA '+(i+1)+'</span><h3>'+l+'</h3>'+meter(pct(topics.filter(t=>t.level===i)))+'<button data-kind="stage" data-id="'+i+'">Abrir plano de implementação →</button>')).join(''));
else if(page==='certs')out=head('FORMAÇÃO POR NÍVEIS','Certificações IAM','Nenhuma certificação é universalmente obrigatória. SC-300 é prioritária para Microsoft IAM; escolha certificações de fornecedores conforme a tecnologia de trabalho e confirme os requisitos oficiais.')+'<div class="note">Sequência recomendada: fundamentos (SC-900 ou equivalente) → especialização (SC-300, Okta, SailPoint ou CyberArk) → arquitetura e gestão (SC-100, CISSP ou CISM). Não é necessário obter todas.</div><div class="cert-layout"><nav class="cert-side">'+['Básica','Intermediária','Avançada'].map((v,i)=>'<button class="cert-level '+(i===0?'selected':'')+'" data-stage="'+v+'">'+v+' ›</button>').join('')+'</nav><div id="cert-results"></div></div>';
else if(page==='progresso')out=head('SEU APRENDIZADO','Meu progresso','Seus dados ficam neste navegador. Exporte um backup para mudar de dispositivo.')+st()+heading('Progresso por nível')+group(levels.map((l,i)=>card('<h3>'+l+'</h3>'+meter(pct(topics.filter(t=>t.level===i)))+'<span class="muted">'+pct(topics.filter(t=>t.level===i))+'% concluído</span>')).join(''))+'<div class="toolbar"><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><button id="reset">Limpar progresso</button><input hidden id="file" type="file" accept=".json,application/json"></div>';
else {location.hash='#inicio';return}app.innerHTML=out+'<footer>IAM Atlas · Guia independente · '+new Date().getFullYear()+' · Confirme sempre os requisitos atuais com os fabricantes.</footer>';if(page==='roadmap'){drawTopics();document.getElementById('search').addEventListener('input',drawTopics)}if(page==='certs')drawCerts('Básica')}
function drawCerts(stage){document.querySelectorAll('.cert-level').forEach(b=>b.classList.toggle('selected',b.dataset.stage===stage));document.getElementById('cert-results').innerHTML='<h2>'+stage+'</h2>'+group(certs.map((c,i)=>({...c,index:i})).filter(c=>c.stage===stage).map(c=>card('<span class="tag">'+c.provider+'</span><h3>'+c.name+'</h3><p>'+c.desc+'</p><button data-kind="cert" data-id="'+c.index+'">Ver certificação →</button>')).join(''))}
function drawTopics(){let q=document.getElementById('search').value.toLowerCase().trim();document.getElementById('topic-results').innerHTML=levels.map((l,i)=>{const list=topics.filter(t=>t.level===i&&(t.title+' '+t.desc).toLowerCase().includes(q));return list.length?'<h2>'+(i+1)+'. '+l+'</h2><div class="list">'+list.map(t=>'<button class="topic" data-kind="topic" data-id="'+topics.indexOf(t)+'"><span><strong>'+t.title+'</strong><small>'+t.desc+'</small></span><span class="check">'+(completed.has(t.id)?'✓':'↗')+'</span></button>').join('')+'</div>':''}).join('')||'<div class="empty">Nenhum tópico encontrado.</div>'}
function open(kind,n){let x,title,body='',id;
if(kind==='topic'){x=topics[n];title=x.title;id=x.id;body='<p>'+x.desc+'</p><h3>O que aprender</h3><p>'+x.desc+'</p><h3>Exercício prático</h3><p>'+x.practice+'</p><h3>Documentação</h3><p><a target="_blank" rel="noopener noreferrer" href="'+x.url+'">Consultar referência oficial ↗</a></p>'}
if(kind==='stage'){title='Etapa '+(n+1)+' · '+levels[n];body='<p>Reutilize o ambiente Atlas Corp construído nas etapas anteriores.</p><h3>Implementação prática</h3><ol>'+labPlan[n].map(t=>'<li>'+t+'</li>').join('')+'</ol><h3>Temas desta etapa</h3><ul>'+topics.filter(t=>t.level===n).map(t=>'<li>'+t.title+'</li>').join('')+'</ul><p>Entregável: configurações, diagramas e evidências documentadas.</p>'}
if(kind==='lab'){x=labs[n];title=x.name;id=x.id;body='<p>'+x.goal+'</p><h3>Passo a passo</h3><ol>'+x.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><h3>Entregável</h3><p>'+x.deliver+'</p>'}
if(kind==='cert'){x=certs[n];title=x.name;id=x.id;body='<p>'+x.desc+'</p><p><a href="'+x.url+'" target="_blank" rel="noopener noreferrer">Página oficial e requisitos ↗</a></p><p>Marque como concluída somente se você obteve a certificação.</p>'}
if(kind==='track'){x=tracks[n];title=x.name;body='<p>'+x.desc+'</p><h3>Competências recomendadas</h3><ol>'+x.ids.map(i=>'<li>'+topics[i].title+(completed.has(topics[i].id)?' ✓':'')+'</li>').join('')+'</ol><p>Concluído: '+pct(x.ids.map(i=>topics[i]))+'%</p>'; }
document.getElementById('detail-body').innerHTML='<span class="eyebrow">IAM ATLAS</span><h2>'+title+'</h2>'+body+(id?'<button class="primary" id="mark" data-item="'+id+'">'+(completed.has(id)?'✓ Concluído · Desmarcar':'Marcar como concluído')+'</button>':'');dialog.showModal()}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){location.hash=page.dataset.page;render()}const item=e.target.closest('[data-kind]');if(item)open(item.dataset.kind,Number(item.dataset.id));if(e.target.closest('[data-stage]'))drawCerts(e.target.closest('[data-stage]').dataset.stage);if(e.target.id==='mark'){const id=e.target.dataset.item;completed.has(id)?completed.delete(id):completed.add(id);localStorage.setItem(KEY,JSON.stringify([...completed]));dialog.close();render()}if(e.target.id==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify({app:'iam-atlas',completed:[...completed]},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='iam-atlas-progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(e.target.id==='import')document.getElementById('file').click();if(e.target.id==='reset'&&confirm('Apagar todas as marcações?')){completed.clear();localStorage.setItem(KEY,'[]');render()}});
document.addEventListener('change',async e=>{if(e.target.id==='file'){try{const f=e.target.files[0];if(!f||f.size>100000)throw Error('Arquivo inválido');const data=JSON.parse(await f.text());if(data.app!=='iam-atlas'||!Array.isArray(data.completed)||!data.completed.every(x=>ids.includes(x)))throw Error('Formato incompatível');if(confirm('Substituir o progresso atual?')){completed=new Set(data.completed);localStorage.setItem(KEY,JSON.stringify([...completed]));render()}}catch(err){alert('Falha ao importar: '+err.message)}}});
document.getElementById('close').onclick=()=>dialog.close();window.addEventListener('hashchange',render);render();
</script></body></html>
