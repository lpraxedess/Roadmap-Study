ocumentação da versão escolhida).","https://docs.goauthentik.io/"],["Microsoft Entra ID gerencia identidades e acesso a aplicações e recursos em nuvem.","É comum em organizações que utilizam Microsoft 365, Azure e aplicações SaaS federadas.","Para centralizar login empresarial, configurar MFA, aplicações e acesso condicional.","Num tenant de teste, crie grupo e usuário, atribua aplicação empresarial e revise logs de entrada; teste políticas em modo de relatório quando disponível.","Portal Microsoft Entra, Microsoft Graph; alguns recursos exigem licença.","https://learn.microsoft.com/en-us/entra/identity/"],["Cloud IAM permite conceder permissões a pessoas e workloads em ambientes de nuvem, normalmente usando roles e credenciais temporárias.","Reduz credenciais estáticas e privilégios excessivos nos serviços cloud.","Ao usar AWS, Azure, automações e pipelines que acessam APIs e recursos.","Na AWS, crie uma role de leitura com policy restrita, assuma-a em ambiente de teste e compare uma ação autorizada com outra negada.","AWS IAM e STS; no Azure, managed identities.","https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html"],["SCIM é um padrão de API para criação, atualização e desativação de identidades; JML organiza admissão, movimentação e desligamento.","Reduz trabalho manual e ajuda a evitar acessos que permanecem ativos após mudança ou saída.","Quando RH e diretórios precisam sincronizar contas com aplicações SaaS.","Use usuários fictícios e uma API SCIM de laboratório; crie conta, modifique departamento e marque-a como inativa; reconcilie os resultados.","SCIM 2.0, Python/REST e IdP compatível.","https://www.rfc-editor.org/rfc/rfc7644"],["IGA significa governança e administração de identidades: quem aprova o acesso, por que existe e quando deve ser revogado.","Oferece rastreabilidade, revisão periódica e controle de conflitos de funções.","Em auditorias, revisão de acessos, mudanças de cargo e gestão de permissões críticas.","Crie um catálogo de permissões e uma campanha simulada de revisão com aprovações, revogações e evidências.","Planilha de laboratório, Microsoft Entra ID Governance ou soluções IGA.","https://learn.microsoft.com/en-us/entra/id-governance/"],["PAM protege acessos privilegiados; PIM gerencia a ativação de privilégios; JIT disponibiliza privilégios temporariamente.","Diminui o risco de abuso ou comprometimento de contas administrativas permanentes.","Quando administradores, sistemas e contas de serviço precisam acessar recursos sensíveis.","Modele fluxo de solicitação e aprovação de privilégio temporário; teste expiração e documentação de acesso emergencial.","Microsoft Entra PIM, HashiCorp Vault e soluções PAM em laboratório.","https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/"],["Operação IAM consiste em monitorar logins, investigar integrações e tratar incidentes e mudanças de forma controlada.","Um serviço IAM útil precisa permanecer disponível e permitir diagnóstico confiável de falhas.","Quando login falha, provisionamento atrasa, permissões divergem ou um usuário perde acesso.","Simule falha de redirect URI, de sincronização de grupo e de MFA; registre hipótese, log relevante, correção e teste de retorno.","Keycloak events, logs Entra, Event Viewer, tickets ITSM fictícios.","https://www.keycloak.org/docs/latest/server_admin/"],["Zero Trust exige avaliar acesso continuamente segundo identidade, contexto e política, sem confiança implícita por localização de rede.","Ajuda a projetar arquiteturas com menor privilégio, separação de funções e controles sobre identidades humanas e não humanas.","Ao combinar acesso remoto, SaaS, aplicações internas, serviços cloud e automações.","Desenhe arquitetura com IdP, duas aplicações e uma identidade de workload; estabeleça condições de acesso, expiração e auditoria.","NIST SP 800-207, Entra ID, Keycloak e ferramentas de logs.","https://csrc.nist.gov/pubs/sp/800/207/final"]]};

const topicGuides=[[{"concept":"TCP/IP é a pilha de protocolos que transporta dados entre endereços IP; TCP estabelece conexões e controla entrega e retransmissões.","importance":"AD, LDAP, Kerberos e HTTPS precisam alcançar servidores e portas corretos; rotas e firewalls incorretos frequentemente parecem falhas de login.","when":"Interfaces de rede de Windows Server, Linux, clientes e dispositivos; no Windows Server, Server Manager → Local Server → Ethernet.","practice":"1. Configure duas VMs na mesma sub-rede isolada\n2. Confira ipconfig /all ou ip addr e a tabela de rotas\n3. Teste TCP 443 com Test-NetConnection após instalar serviço HTTPS e compare com teste de ICMP.","verify":"Consegue explicar diferença entre IP e TCP, identificar IP/máscara/gateway/porta, verificar rota, distinguir bloqueio ICMP de TCP e diagnosticar uma falha de comunicação.","tools":"Windows Server (Server Manager, ipconfig, Test-NetConnection); Ubuntu (ip, ss, ping); VMs e rede virtual isolada.","url":"https://learn.microsoft.com/en-us/windows-server/networking/technologies/network-subsystem/net-sub-interface"},{"concept":"DNS traduz nomes em registros como A e SRV; AD usa SRV para localizar controladores de domínio.","importance":"Clientes de domínio usam DNS para localizar autenticação Kerberos e LDAP; servidor DNS incorreto impede ingresso e logon.","when":"Windows Server → Server Manager → Add Roles and Features → DNS Server; depois Tools → DNS. Também existe BIND no Linux.","practice":"1. Instale DNS Server em VM isolada e confira zona de teste\n2. Crie registro A e valide com nslookup\n3. Em AD, consulte SRV _ldap._tcp.dc._msdcs.\u003cdomínio> e simule DNS inválido somente no cliente de laboratório.","verify":"Identifica registros e diagnostica falha de resolução.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"HTTP é protocolo de requisição e resposta web; HTTPS é HTTP protegido por TLS e certificado.","importance":"IdPs e aplicações IAM usam HTTPS para login, callbacks, APIs e tokens; certificados inválidos quebram integrações ou expõem dados.","when":"Windows Server → IIS Manager → Sites → Bindings → Add HTTPS/443; ou proxy reverso do Keycloak/Authentik.","practice":"1. Instale Web Server (IIS) em VM de teste\n2. Associe certificado ao binding HTTPS da porta 443\n3. Teste navegador e curl -I e inspecione validade e nome do certificado.","verify":"Consegue explicar HTTP, TLS, certificado e porta 443, publicar um site de teste em HTTPS e diagnosticar erro de certificado ou nome.","tools":"Windows Server, IIS, navegador, curl e OpenSSL.","url":"https://learn.microsoft.com/en-us/iis/manage/configuring-security/how-to-set-up-ssl-on-iis"},{"concept":"TLS negocia canal criptografado; o certificado X.509 vincula identidade do servidor a chave pública.","importance":"Protege credenciais e tokens durante tráfego LDAP, HTTPS e APIs; cadeia ou hostname inválidos provocam rejeição segura.","when":"Bindings HTTPS em IIS ou proxy reverso; LDAPS no serviço de diretório; gestão de certificados no Windows e Linux.","practice":"1. Crie certificado de laboratório com nome DNS consistente\n2. Configure HTTPS e examine detalhes no navegador ou openssl s_client\n3. Simule expiração ou nome incorreto em ambiente isolado e observe o erro.","verify":"Explique como tls e certificados funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"Contas locais e ACLs NTFS atribuem direitos para acessar arquivos e executar operações.","importance":"Conceder privilégio excessivo permite leitura ou alteração indevida de dados usados em processos IAM.","when":"Computer Management → Local Users and Groups e Propriedades → Security da pasta; Windows Server com políticas de domínio também.","practice":"1. Crie dois usuários locais de laboratório\n2. Crie pasta e atribua leitura a um usuário e gravação a outro\n3. Teste acesso com ambas as contas e analise permissões efetivas.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"UID, GID, grupos e bits de leitura, escrita e execução controlam recursos POSIX.","importance":"Serviços IAM em Linux exigem permissões mínimas para arquivos de configuração, certificados e segredos.","when":"Terminal Linux com useradd/usermod, chown, chmod, id e ls -l.","practice":"1. Crie usuários e grupo fictícios\n2. Crie arquivo de teste com proprietário e permissões restritas\n3. Tente acessá-lo com conta autorizada e não autorizada.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"CLI executa ferramentas administrativas por comandos reproduzíveis e scripts.","importance":"Diagnóstico de autenticação requer consultar rede, processos, DNS, certificados e logs com precisão.","when":"PowerShell/Terminal no Windows; shell Bash no Linux.","practice":"1. Consulte endereço IP, DNS e serviço de teste por terminal\n2. Redirecione saída para arquivo sem dados sensíveis\n3. Documente comando, resultado esperado e retorno observado.","verify":"Explique como linha de comando (cli) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"PowerShell é shell e linguagem de automação orientados a objetos com cmdlets e pipeline.","importance":"Administração AD e Entra usa automação para inventário e correção auditável.","when":"Windows PowerShell ou PowerShell 7; módulos de AD em servidores adequados e Microsoft Graph para Entra.","practice":"1. Execute Get-LocalUser em VM Windows\n2. Filtre contas desabilitadas e exporte CSV de teste\n3. Crie script de consulta sem alterar identidades reais.","verify":"Explique como powershell funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"Python é linguagem de automação usada para consumir APIs, processar JSON e validar inventários.","importance":"Integrações IAM frequentemente requerem transformar atributos e conciliar identidades entre sistemas.","when":"Python em estação isolada, venv e bibliotecas padrão como json/csv/urllib.","practice":"1. Leia JSON fictício contendo usuários e departamentos\n2. Detecte duplicidade de identificadores\n3. Gere CSV de resultado e trate campos ausentes.","verify":"Explique como python básico funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"REST organiza recursos acessados por HTTP com métodos como GET, POST, PATCH e DELETE.","importance":"Entra Graph, SCIM e aplicações IAM expõem operações de ciclo de vida e consulta via APIs.","when":"Endpoints documentados dos sistemas; ferramentas curl, Postman ou PowerShell Invoke-RestMethod.","practice":"1. Faça GET a API de teste e verifique status e corpo\n2. Envie POST com recurso fictício quando a API permitir\n3. Teste requisição sem autorização e examine 401/403.","verify":"Explique como apis rest funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"JSON representa objetos, listas e valores e é comum em APIs de identidade e tokens.","importance":"Atributos, políticas e respostas de provisionamento são frequentemente transportados em JSON.","when":"Corpo de requisições REST, Microsoft Graph, SCIM e claims JWT.","practice":"1. Monte objeto de usuário com id, active e groups\n2. Valide sintaxe com python -m json.tool\n3. Compare respostas de API com atributos esperados.","verify":"Explique como json funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"},{"concept":"Git registra versões e histórico de scripts e configurações textuais.","importance":"Mudanças em automações IAM precisam rastreabilidade, revisão e capacidade de reversão.","when":"Repositório local ou GitHub sem incluir tokens, senhas ou arquivos secretos.","practice":"1. Inicialize repositório de laboratório com git init\n2. Faça commit de script de consulta\n3. Altere arquivo, veja git diff e reverta uma mudança de teste.","verify":"Explique como git funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server ou Ubuntu; PowerShell, curl e Python.","url":"https://learn.microsoft.com/en-us/windows-server/"}],[{"concept":"Identidade digital é a representação de uma pessoa, serviço ou dispositivo em sistemas por identificadores e atributos.","importance":"É a origem lógica das contas e políticas de acesso; identidade mal correlacionada gera duplicidades e concessões incorretas.","when":"Cadastro corporativo, diretório AD, Entra e plataforma IGA.","practice":"1. Modele funcionário e serviço com identificadores distintos\n2. Associe cada identidade às contas em aplicações\n3. Documente atributo que estabelece correlação.","verify":"Explique como identidade digital funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Conta é o objeto operacional que representa a identidade dentro de um sistema.","importance":"Uma pessoa pode ter várias contas; inventariá-las permite revogar acesso ao desligar.","when":"AD Users and Computers, Entra ID → Users e administração das aplicações.","practice":"1. Crie usuário fictício em dois sistemas de laboratório\n2. Relacione contas a uma identidade única\n3. Desative uma conta e observe o alcance da revogação.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Credencial é o mecanismo usado para demonstrar identidade, como senha, chave criptográfica ou certificado.","importance":"Credenciais vazadas permitem autenticação indevida mesmo quando a conta tem permissões limitadas.","when":"Métodos de autenticação do IdP, cofre de segredos e gerenciamento de certificados.","practice":"1. Liste credenciais permitidas no IdP de teste\n2. Ative um método seguro na conta de laboratório\n3. Revogue-o e teste nova autenticação.","verify":"Explique como credenciais funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Atributos como departamento, cargo e identificador descrevem identidade e alimentam políticas.","importance":"Erros em atributos podem causar provisionamento em grupo ou aplicação errada.","when":"AD Attribute Editor, Entra ID propriedades de usuário, SCIM user schema.","practice":"1. Crie dois usuários de teste com departamentos distintos\n2. Configure regra baseada em departamento\n3. Altere atributo e confira atualização do acesso.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Autenticação verifica quem é a entidade; autorização decide ações permitidas; auditoria registra atividades.","importance":"Login bem-sucedido não significa permissão para recursos; logs são necessários para rastreio.","when":"IdP autentica, backend aplica autorização, SIEM/IdP registra eventos.","practice":"1. Configure aplicação de teste com login e duas roles\n2. Tente recurso restrito com conta sem autorização\n3. Verifique registro de sucesso e negação.","verify":"Relaciona evidência, causa provável, correção e novo teste.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Menor privilégio limita cada identidade às permissões necessárias à tarefa.","importance":"Reduz impacto de conta comprometida e abuso interno.","when":"Roles de AD, Entra, AWS IAM, aplicativos e PAM.","practice":"1. Monte matriz de tarefas e permissões\n2. Retire role administrativa de conta de teste\n3. Confirme que a tarefa permitida funciona e operação excessiva falha.","verify":"Explique como menor privilégio funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Zero Trust é abordagem de acesso sem confiança implícita baseada na localização de rede.","importance":"Acesso deve considerar identidade, contexto e política mesmo dentro da rede corporativa.","when":"Políticas de acesso condicional, gateways e enforcement em aplicações.","practice":"1. Desenhe fluxo usuário → IdP → aplicativo\n2. Adicione condição de MFA e dispositivo\n3. Teste acesso dentro e fora das condições.","verify":"Explica verificação explícita e menor privilégio.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Joiner cria identidade e permissões iniciais quando vínculo organizacional começa.","importance":"Automação evita atraso e acesso não aprovado.","when":"Fluxo RH → IGA/IdP → AD/Entra → aplicação.","practice":"1. Crie evento fictício de contratação\n2. Mapeie departamento para grupos iniciais\n3. Simule provisionamento e registre aprovação.","verify":"Explique como joiner (admissão) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Mover atualiza atributos e acessos quando alguém muda de função ou departamento.","importance":"Sem retirada dos direitos anteriores ocorre acúmulo de privilégios.","when":"Fluxos JML e regras de grupos dinâmicos ou IGA.","practice":"1. Mude usuário fictício de RH para Financeiro\n2. Remova grupo RH antes de conceder grupo novo\n3. Valide permissões resultantes.","verify":"Explique como mover (movimentação) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Leaver desativa identidades e revoga acessos quando termina o vínculo.","importance":"Contas ativas após desligamento são risco de segurança e auditoria.","when":"HR/IGA, AD, Entra, SCIM, VPN e aplicações.","practice":"1. Crie checklist de sistemas usados pela identidade fictícia\n2. Desabilite conta e revogue sessão quando disponível\n3. Verifique que login e aplicação estão inacessíveis.","verify":"Explique como leaver (desligamento) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Políticas IAM documentam regras de concessão, revisão, autenticação e revogação.","importance":"Padronizam decisões e permitem demonstrar conformidade.","when":"Políticas corporativas e regras técnicas em IdP, IGA e aplicações.","practice":"1. Escreva política curta de concessão com dono e aprovador\n2. Estabeleça prazo e revisão\n3. Aplique a solicitação fictícia.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"Risco de identidade considera probabilidade e impacto de abuso, roubo ou excesso de acesso.","importance":"Ajuda priorizar MFA, eliminação de contas órfãs e limitação de privilégio.","when":"Avaliação de risco, sign-in risk e governança de acesso.","practice":"1. Registre três cenários como senha vazada e admin permanente\n2. Classifique impacto e probabilidade\n3. Associe mitigação concreta a cada um.","verify":"Explique como riscos de identidade funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},{"concept":"SoD separa atividades incompatíveis para impedir fraude e erros sem supervisão.","importance":"Uma conta que cria e aprova pagamento concentra risco operacional.","when":"Matrizes de conflitos IGA, RBAC e processos financeiros.","practice":"1. Crie roles Solicitar e Aprovar\n2. Estabeleça regra de incompatibilidade\n3. Teste pedido de concessão conflitante e bloqueio.","verify":"Explique como segregação de funções (sod) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Planilha de acessos, Microsoft Entra ID ou Keycloak.","url":"https://csrc.nist.gov/pubs/sp/800/63/4/final"}],[{"concept":"Active Directory Domain Services é serviço de diretório Microsoft que armazena objetos de domínio e oferece autenticação e políticas.","importance":"Base de identidades Windows em muitas empresas; disponibiliza contas para SSO e controle de acesso.","when":"Windows Server → Server Manager → Add Roles and Features → Active Directory Domain Services.","practice":"1. Instale AD DS em VM Windows Server isolada\n2. Promova servidor a DC de domínio de laboratório com DNS\n3. Crie conta de teste e valide login em cliente.","verify":"Explique como ad ds funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"Domínio é limite lógico para objetos e administração; floresta agrega domínios que compartilham esquema e relações de confiança.","importance":"Desenho influencia administração, autenticação e limites de confiança.","when":"AD DS em Windows Server e consoles Active Directory Domains and Trusts.","practice":"1. Desenhe domínio único de laboratório\n2. Consulte nome de domínio e floresta com PowerShell Get-ADForest/Get-ADDomain\n3. Descreva quando precisaria de domínio adicional.","verify":"Explique como domínio e floresta funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"DC mantém cópia replicada do AD DS e atende autenticações e consultas.","importance":"Sem DC alcançável clientes podem enfrentar falhas de login e políticas.","when":"Windows Server com função AD DS; ferramentas dcdiag, repadmin e DNS Manager.","practice":"1. Identifique DC com nltest /dsgetdc:\u003cdomínio>\n2. Execute dcdiag em laboratório\n3. Observe registros SRV e saúde do serviço.","verify":"Explique como controladores de domínio funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"OU organiza objetos do Active Directory e delimita escopo de GPO e delegação.","importance":"Evita concessão administrativa sobre todo o domínio e organiza políticas.","when":"Active Directory Users and Computers → domínio → New → Organizational Unit.","practice":"1. Crie OUs Pessoas e Servidores\n2. Mova usuário fictício para OU adequada\n3. Aplique GPO de teste apenas a uma OU.","verify":"Explique como organizational units (ou) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"Objetos user do AD representam contas autenticáveis no domínio.","importance":"Estado, grupos e atributos da conta determinam acesso e autenticação.","when":"Active Directory Users and Computers ou PowerShell ActiveDirectory.","practice":"1. Crie usuário de laboratório via New-ADUser\n2. Configure senha inicial segura e habilite conta\n3. Desabilite e teste bloqueio de login.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"Grupos de segurança do AD agregam contas para concessão de direitos.","importance":"RBAC prático depende de grupos bem definidos e revisão dos membros.","when":"AD Users and Computers → New → Group e membership nas propriedades.","practice":"1. Crie grupo APP-Leitores\n2. Adicione usuário fictício\n3. Aplique grupo numa ACL de pasta e valide acesso.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"Group Policy Objects definem configurações de computadores e usuários de domínio.","importance":"Padroniza controles de estação e servidor relevantes à segurança de acesso.","when":"Group Policy Management (gpmc.msc) no Windows Server.","practice":"1. Crie GPO de laboratório vinculada à OU\n2. Configure política não destrutiva\n3. Em cliente execute gpupdate e gpresult /r.","verify":"Explique como gpo funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"Delegação concede tarefas específicas de administração sobre objetos sem dar domínio inteiro.","importance":"Reduz uso de Domain Admin e segmenta responsabilidades.","when":"AD Users and Computers → OU → Delegate Control.","practice":"1. Crie grupo Helpdesk-Lab\n2. Delegue reset de senhas só numa OU\n3. Teste operação dentro e fora do escopo.","verify":"Explique como delegação administrativa funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"Kerberos autentica por tickets concedidos pelo KDC, evitando reenviar senha ao serviço em cada acesso.","importance":"É mecanismo central do logon AD e SSO de serviços internos.","when":"Clientes associados ao domínio e serviços AD; ferramenta klist.","practice":"1. Faça login com usuário de domínio\n2. Execute klist e identifique tickets\n3. Acesse compartilhamento para obter ticket de serviço.","verify":"Explica TGT, ticket de serviço e efeito da sincronização de horário.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"TGT demonstra autenticação inicial perante o KDC; service ticket autoriza apresentação a serviço específico.","importance":"Tipos e validade dos tickets são úteis no diagnóstico de SSO e expiração.","when":"Windows klist e logs Kerberos do DC.","practice":"1. Examine klist após login\n2. Acesse recurso SMB de laboratório\n3. Compare TGT e ticket CIFS obtido.","verify":"Explique como tickets kerberos funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"SPN identifica instância de serviço ligada à conta usada pelo Kerberos.","importance":"SPN duplicado ou inexistente pode impedir autenticação Kerberos de aplicação.","when":"Comando setspn e atributos servicePrincipalName no AD.","practice":"1. Consulte setspn -L de conta de serviço fictícia\n2. Liste registros no domínio com setspn -Q\n3. Documente nome de serviço esperado sem alterar produção.","verify":"Explique como service principal names (spn) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},{"concept":"Diagnóstico AD conecta sintomas de logon a resolução DNS e eventos do Windows.","importance":"Problema aparente de senha pode ser falta de DC, DNS ou relógio correto.","when":"DNS Manager, Event Viewer e Windows PowerShell no domínio.","practice":"1. Use nslookup para consultar registros do DC\n2. Examine Security/System em Event Viewer\n3. Corrija resolução na VM e refaça login.","verify":"Relaciona evidência, causa provável, correção e novo teste.","tools":"Windows Server AD DS, PowerShell e Event Viewer.","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"}],[{"concept":"DN é caminho único do objeto na árvore LDAP, com componentes como CN, OU e DC.","importance":"Bind e buscas precisam identificar corretamente onde está o objeto.","when":"Estrutura de AD, OpenLDAP e clientes LDAP.","practice":"1. Localize DN de usuário no AD ou ldapsearch\n2. Decomponha CN/OU/DC\n3. Mova objeto de OU em laboratório e observe mudança.","verify":"Explique como distinguished name (dn) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"OpenLDAP ou Active Directory, ldapsearch.","url":"https://www.openldap.org/doc/admin26/"},{"concept":"Bind estabelece contexto de autenticação de uma conexão LDAP ao diretório.","importance":"Credenciais e permissões do bind determinam quais objetos o cliente acessa.","when":"Conectores LDAP de aplicações e ferramentas ldapsearch; prefira TLS.","practice":"1. Configure diretório com usuário de consulta restrita\n2. Execute bind seguro e busca LDAP\n3. Troque credencial por inválida e examine resposta.","verify":"Explica credenciais, bind e consultas de diretório.","tools":"OpenLDAP ou Active Directory, ldapsearch.","url":"https://www.openldap.org/doc/admin26/"},{"concept":"Filtros LDAP selecionam objetos com expressões como (uid=joao) e (&(objectClass=user)(...)).","importance":"Integrações usam filtros para restringir usuários e grupos sincronizados.","when":"Configuração de busca dos conectores LDAP, AD e OpenLDAP.","practice":"1. Crie usuários fictícios de departamentos diferentes\n2. Busque com (department=TI) e filtro AND\n3. Confira que apenas objetos esperados aparecem.","verify":"Explique como filtros ldap funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"OpenLDAP ou Active Directory, ldapsearch.","url":"https://www.openldap.org/doc/admin26/"},{"concept":"LDAPS transporta LDAP em TLS, normalmente na porta TCP 636.","importance":"Impede exposição de credenciais e dados de diretório na rede.","when":"Certificado do servidor LDAP/AD e configuração do cliente para TLS.","practice":"1. Configure certificado de laboratório no servidor\n2. Conecte por LDAPS e valide cadeia\n3. Teste cliente que não confia no certificado.","verify":"Explique como ldaps funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"OpenLDAP ou Active Directory, ldapsearch.","url":"https://www.openldap.org/doc/admin26/"},{"concept":"Schema LDAP define classes de objetos e seus atributos obrigatórios e opcionais.","importance":"Mapeamentos corretos permitem autenticar e provisionar sem conflitos de dados.","when":"AD Schema/Attribute Editor e OpenLDAP subschema.","practice":"1. Inspecione objectClass, cn, mail e memberOf\n2. Compare dois tipos de objeto\n3. Documente campo obrigatório e possível valor.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"OpenLDAP ou Active Directory, ldapsearch.","url":"https://www.openldap.org/doc/admin26/"},{"concept":"Identidade híbrida combina dados locais e nuvem com processos de correspondência e sincronização.","importance":"Atributos divergentes e duplicidades podem criar contas erradas ou travar provisionamento.","when":"Microsoft Entra Connect Sync ou Cloud Sync; ferramentas do fabricante.","practice":"1. Desenhe AD → Entra com atributo de correlação\n2. Simule usuários com UPN duplicado em dados fictícios\n3. Registre estratégia de conflito e fonte autoritativa.","verify":"Explique como sincronização, identidade híbrida e conflitos funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"OpenLDAP ou Active Directory, ldapsearch.","url":"https://www.openldap.org/doc/admin26/"},{"concept":"Consultas LDAP recuperam dados do diretório; auditoria registra ações sensíveis.","importance":"Acesso de leitura excessivo expõe atributos pessoais e impede rastreabilidade.","when":"ldapsearch, PowerShell AD e eventos de auditoria de diretório.","practice":"1. Faça busca com conta de leitura mínima\n2. Limite atributos retornados\n3. Registre alteração fictícia e identifique evento associado.","verify":"Relaciona evidência, causa provável, correção e novo teste.","tools":"OpenLDAP ou Active Directory, ldapsearch.","url":"https://www.openldap.org/doc/admin26/"}],[{"concept":"RBAC associa roles a permissões e usuários, separando funções e operações.","importance":"Reduz concessões individuais e facilita revisão e revogação.","when":"Roles do IdP e autorização de aplicações ou AWS IAM.","practice":"1. Crie roles Leitor e Editor em app de laboratório\n2. Mapeie ações a roles\n3. Valide que Leitor não pode editar.","verify":"Comprova ação permitida e negada por papel.","tools":"Keycloak para roles + aplicação que valide as permissões no servidor.","url":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"concept":"Role engineering define conjuntos de permissões coerentes com funções reais.","importance":"Papéis amplos acumulam direitos e tornam revisões ineficazes.","when":"IGA, catálogos IAM e grupos de autorização em aplicações.","practice":"1. Liste tarefas de três funções fictícias\n2. Associe apenas permissões necessárias\n3. Identifique sobreposição e conflito.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Keycloak para roles + aplicação que valide as permissões no servidor.","url":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"concept":"ABAC decide acesso a partir de atributos de sujeito, recurso, ação e ambiente.","importance":"Permite regras de contexto mais finas que roles fixas.","when":"Motor de políticas da aplicação, OPA ou IAM com condições.","practice":"1. Crie regra departamento igual ao do documento\n2. Teste dois perfis e dois recursos\n3. Altere um atributo e observe decisão.","verify":"Testa alteração de atributo e decisão correspondente.","tools":"Keycloak para roles + aplicação que valide as permissões no servidor.","url":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"concept":"Access Control List associa permissões a usuários ou grupos sobre um recurso.","importance":"É a autorização efetiva de muitos arquivos e objetos Windows/Linux.","when":"Propriedades Security em NTFS ou setfacl no Linux.","practice":"1. Crie pasta de teste\n2. Dê leitura ao grupo A e negue gravação\n3. Confirme acesso de duas contas.","verify":"Explique como acl funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak para roles + aplicação que valide as permissões no servidor.","url":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"concept":"Deny by default rejeita qualquer operação que não possua autorização explícita.","importance":"Prevenção contra novos endpoints ou roles inadvertidamente públicos.","when":"Middlewares e verificações de autorização do backend.","practice":"1. Crie endpoint protegido em aplicação de teste\n2. Negue requisição sem role\n3. Compare respostas 401, 403 e 200.","verify":"Explique como negação por padrão funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak para roles + aplicação que valide as permissões no servidor.","url":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"concept":"Entitlement é direito específico numa aplicação; SoD limita combinações incompatíveis.","importance":"Governança precisa revisar cada direito e detectar concentração de tarefas críticas.","when":"Catálogo IGA e matrizes de funções da organização.","practice":"1. Cadastre entitlements Aprovar e Solicitar\n2. Defina conflito\n3. Simule pedido que deve ser negado.","verify":"Explique como entitlements e sod funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak para roles + aplicação que valide as permissões no servidor.","url":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},{"concept":"Verificação de autorização deve ocorrer no servidor em cada operação, mesmo se UI ocultar ação.","importance":"Usuário pode chamar APIs diretamente; esconder botão não protege dados.","when":"Controllers e middleware de backend em APIs.","practice":"1. Crie GET e PATCH de recurso fictício\n2. Teste com conta sem role\n3. Registre 403 para operação proibida e 200 para permitida.","verify":"Explique como testes de autorização no backend funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak para roles + aplicação que valide as permissões no servidor.","url":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"}],[{"concept":"Senha é credencial baseada em conhecimento; recuperação deve confirmar identidade sem expor conta.","importance":"Redefinição vulnerável e reutilização permitem takeover de identidades.","when":"Políticas do IdP, Entra ID Password Reset e administração das aplicações.","practice":"1. Habilite reset em serviço de laboratório\n2. Tente fluxo com conta válida e desconhecida\n3. Verifique expiração de links e ausência de enumeração.","verify":"Explique como senhas e recuperação segura funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak ou Microsoft Entra ID; autenticador compatível.","url":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"concept":"TOTP produz códigos de uso breve calculados a partir de segredo e tempo.","importance":"É fator adicional que reduz risco de senha roubada, embora não seja resistente a phishing.","when":"Métodos MFA do Entra, Keycloak ou Authentik.","practice":"1. Ative TOTP para usuário teste\n2. Faça login com e sem código\n3. Teste diferença de horário e recuperação.","verify":"Explique como totp funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak ou Microsoft Entra ID; autenticador compatível.","url":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"concept":"FIDO2/WebAuthn autentica com chave privada guardada no autenticador, vinculando credencial ao domínio.","importance":"Reduz phishing e evita segredos reutilizáveis enviados ao servidor.","when":"Políticas de métodos de autenticação e aplicações com WebAuthn.","practice":"1. Ative método WebAuthn em IdP isolado\n2. Registre passkey ou chave compatível\n3. Teste login e exclusão da credencial.","verify":"Explique como fido2 e webauthn funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak ou Microsoft Entra ID; autenticador compatível.","url":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"concept":"Passkeys são credenciais FIDO baseadas em chave pública que podem substituir senha, conforme implementação.","importance":"Reduz exposição a phishing e melhora a experiência de login.","when":"Windows Hello, navegadores, gestores de passkey e IdPs que suportam WebAuthn.","practice":"1. Registre passkey em aplicação de laboratório\n2. Teste login sem senha quando suportado\n3. Revogue passkey e verifique recuperação.","verify":"Explica a autenticação e resistência a phishing.","tools":"Keycloak ou Microsoft Entra ID; autenticador compatível.","url":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"concept":"Sessão associa requisições autenticadas a um contexto; cookies seguros transportam identificadores de sessão.","importance":"Sequestrar sessão pode contornar novo desafio de senha ou MFA.","when":"Configuração da aplicação e do IdP: SameSite, Secure, HttpOnly e timeouts.","practice":"1. Inspecione atributos de cookie em app de teste\n2. Configure expiração curta e logout\n3. Observe comportamento após revogar sessão.","verify":"Explique como sessões, cookies e revogação funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak ou Microsoft Entra ID; autenticador compatível.","url":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"concept":"Acesso baseado em risco avalia contexto como localização, dispositivo e sinais de comprometimento.","importance":"Pode exigir MFA ou bloquear acessos anômalos mesmo após credencial correta.","when":"Entra Conditional Access e políticas adaptativas de IdPs.","practice":"1. Crie política direcionada só a grupo teste\n2. Use modo relatório quando possível\n3. Compare logs de acesso esperado e bloqueado.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Keycloak ou Microsoft Entra ID; autenticador compatível.","url":"https://pages.nist.gov/800-63-4/sp800-63b.html"}],[{"concept":"IdP é serviço que autentica usuários e emite informações confiáveis para aplicações.","importance":"Centraliza MFA, sessão, logs e padrões SAML/OIDC utilizados em SSO.","when":"Microsoft Entra, Keycloak ou Authentik na configuração do tenant/realm.","practice":"1. Crie usuário fictício no IdP\n2. Registre aplicativo cliente\n3. Valide que login ocorre no domínio do provedor.","verify":"Explique como identity provider (idp) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Microsoft Entra ID, Keycloak ou Authentik + aplicação SAML de laboratório.","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on"},{"concept":"SP é aplicação consumidora de autenticação federada, especialmente em SAML.","importance":"A confiança entre SP e IdP depende de endpoints e validações corretas.","when":"Configurações SAML do aplicativo: Entity ID, ACS e metadata.","practice":"1. Selecione app SAML de laboratório\n2. Identifique Entity ID e ACS\n3. Cadastre SP no IdP e teste login.","verify":"Explique como service provider (sp) funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Microsoft Entra ID, Keycloak ou Authentik + aplicação SAML de laboratório.","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on"},{"concept":"SSO reutiliza autenticação centralizada para iniciar sessão em múltiplas aplicações.","importance":"Diminui senhas dispersas e permite MFA consistente; não substitui autorização.","when":"Entra Enterprise Applications → Single sign-on ou Clients no Keycloak.","practice":"1. Integre aplicação fictícia via OIDC ou SAML\n2. Atribua usuário e autentique no IdP\n3. Teste acesso sem atribuição e sessão.","verify":"Explica IdP/SP, login e limites da autorização.","tools":"Microsoft Entra ID, Keycloak ou Authentik + aplicação SAML de laboratório.","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on"},{"concept":"Metadata SAML é XML que publica Entity ID, URLs de serviços e certificados de assinatura.","importance":"Troca de metadados evita divergência de endpoints e falhas de confiança.","when":"Telas de configuração SAML do IdP e SP.","practice":"1. Exporte metadata XML de ambos\n2. Encontre entityID, ACS, SingleSignOnService e certificado\n3. Compare com valores configurados.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Microsoft Entra ID, Keycloak ou Authentik + aplicação SAML de laboratório.","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on"},{"concept":"Assertion SAML é documento XML com declarações sobre autenticação, sujeito e atributos.","importance":"SP deve validar audiência, tempo, destinatário e assinatura antes de aceitar login.","when":"Tráfego SAML em aplicação de teste e ferramenta de inspeção apropriada.","practice":"1. Capture resposta SAML exclusivamente de conta fictícia\n2. Localize Subject, Conditions e AudienceRestriction\n3. Teste falha por audiência alterada em ambiente isolado.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Microsoft Entra ID, Keycloak ou Authentik + aplicação SAML de laboratório.","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on"},{"concept":"Assinaturas XML verificam integridade e emissor das mensagens/assertions SAML.","importance":"Ignorar assinatura pode permitir aceitação de afirmações de identidade forjadas.","when":"Configuração de certificado público de assinatura no SP e IdP.","practice":"1. Confira certificado configurado no SP\n2. Teste login válido\n3. Substitua certificado por outro apenas em laboratório e observe rejeição.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Microsoft Entra ID, Keycloak ou Authentik + aplicação SAML de laboratório.","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on"},{"concept":"Federação SAML estabelece confiança entre IdP e SP para autenticação via navegador.","importance":"Viabiliza SSO para aplicativos corporativos sem senha local por aplicação.","when":"Entra Enterprise Applications → Single sign-on → SAML ou Keycloak Clients → SAML.","practice":"1. Configure Entity ID e Assertion Consumer Service URL\n2. Importe metadata/certificado conforme aplicativo\n3. Atribua usuário e teste login e logout.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Microsoft Entra ID, Keycloak ou Authentik + aplicação SAML de laboratório.","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on"},{"concept":"Diagnóstico SSO correlaciona erros de IdP, SP, relógio, certificado e redirecionamento.","importance":"Falha de confiança ou URL pode impedir acesso de todo um grupo.","when":"Logs de entrada Entra/Keycloak e configurações SAML/OIDC dos dois lados.","practice":"1. Execute login com usuário teste\n2. Anote correlação de logs e mensagem\n3. Provoque callback inválido e restaure após verificar causa.","verify":"Relaciona evidência, causa provável, correção e novo teste.","tools":"Microsoft Entra ID, Keycloak ou Authentik + aplicação SAML de laboratório.","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on"}],[{"concept":"Authorization Code entrega código de autorização a cliente; PKCE vincula troca do código ao solicitante.","importance":"Impede interceptação útil do código e é padrão em clientes públicos modernos.","when":"App Registrations no Entra ou Clients Keycloak; cliente OIDC com redirect URI.","practice":"1. Registre cliente OIDC com code flow e PKCE\n2. Observe code_challenge e code_verifier no fluxo de teste\n3. Valide token obtido no callback.","verify":"Explique como authorization code com pkce funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"Scope é autorização solicitada pelo cliente para acesso a recursos ou escopo OIDC como openid.","importance":"Scopes limitam quais operações e dados o token pode habilitar.","when":"Parâmetro scope na autorização OAuth e permissões de API do IdP.","practice":"1. Solicite openid profile em cliente teste\n2. Compare tokens com e sem scope adicional\n3. Observe resposta da API ao scope insuficiente.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"Claim é declaração de identidade/contexto presente em token ou assertion.","importance":"Aplicações usam sub, email e roles para criar contexto, mas precisam validar origem do token.","when":"ID token OIDC e mapeadores de claims de IdPs.","practice":"1. Emita token de laboratório\n2. Decodifique payload e identifique sub e email\n3. Altere mapeamento de claim no IdP e repita.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"Consentimento registra aprovação de permissões solicitadas por um cliente OAuth.","importance":"Excesso de consentimento pode conceder acesso indevido a dados via aplicativo.","when":"Consentimento de usuário ou administrador em Entra App Registrations/API permissions.","practice":"1. Crie app fictícia pedindo permissões mínimas\n2. Observe tela ou política de consentimento\n3. Revogue aprovação e tente novo acesso.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"ID token OIDC informa ao cliente o evento de autenticação do usuário.","importance":"Não deve ser usado no lugar do access token para autorizar APIs.","when":"Resposta OIDC ao cliente, com iss, sub, aud e exp.","practice":"1. Receba ID token de IdP de teste\n2. Verifique assinatura, audience e expiração\n3. Compare token com access token.","verify":"Valida emissor, audiência, expiração e assinatura.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"Access token autoriza cliente a chamar recurso protegido em OAuth.","importance":"API deve validar emissor, audiência, assinatura e autorização adequada.","when":"Cabeçalho Authorization: Bearer na API de teste.","practice":"1. Obtenha token com scope restrito\n2. Chame endpoint autorizado e não autorizado\n3. Teste token vencido ou audiência errada.","verify":"Distingue autorização de autenticação.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"JWT é formato compacto de claims codificados, com proteção por assinatura ou criptografia conforme o tipo.","importance":"Decodificar não basta; aceitar assinatura ou algoritmo indevido compromete confiança.","when":"Tokens OAuth/OIDC em aplicações e validadores do backend.","practice":"1. Gere token de laboratório assinado\n2. Separe header, payload e assinatura\n3. Valide assinatura e rejeite chave incorreta.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"Issuer (iss) identifica o provedor emissor do token.","importance":"Aceitar token de emissor não confiável permite impersonação entre tenants/IdPs.","when":"Configuração de validação JWT no backend e metadata OIDC.","practice":"1. Configure issuer esperado em API local\n2. Teste token de IdP autorizado\n3. Teste iss diferente e registre rejeição.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"Audience (aud) identifica o destinatário previsto de um token.","importance":"Token válido para outra API não deve autorizar este recurso.","when":"Validação de tokens no backend/API gateway.","practice":"1. Gere token para API A\n2. Envie para API B\n3. Confirme bloqueio por audiência.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"State associa resposta OAuth à solicitação iniciada pelo cliente e ajuda a mitigar CSRF.","importance":"Impede aceitar respostas de fluxos de autenticação não iniciados pela sessão correta.","when":"Cliente OAuth/OIDC durante redirecionamento para IdP.","practice":"1. Registre state aleatório em requisição de laboratório\n2. Compare callback esperado\n3. Teste state divergente.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"},{"concept":"Nonce vincula ID token a uma solicitação OIDC específica para mitigação de replay.","importance":"Ajuda impedir aceitação de ID tokens de outro fluxo.","when":"Parâmetro nonce em OIDC e validação de claim no cliente.","practice":"1. Solicite login com nonce gerado localmente\n2. Compare nonce retornado no ID token\n3. Rejeite resposta com valor divergente.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Keycloak, Authentik ou Entra ID com cliente OIDC de teste.","url":"https://openid.net/developers/how-connect-works/"}],[{"concept":"Instalar ambientes de laboratório isolados é um conhecimento específico de Keycloak e Authentik. Investigue seu funcionamento técnico, suas dependências e o papel que desempenha no gerenciamento de identidades e acessos.","importance":"Permitem estudar autenticação, provedores, grupos, políticas e federação sem depender de produção.","when":"Ao prototipar SSO, conectar aplicações internas e aprender administração de um IdP.","practice":"Em ambiente de teste, configure ou examine instalar ambientes de laboratório isolados com dados fictícios, observe uma operação válida e simule um erro de configuração. Documente o resultado.","verify":"Explique como instalar ambientes de laboratório isolados funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"Docker; Keycloak ou Authentik (use documentação da versão escolhida).","url":"https://docs.goauthentik.io/"},{"concept":"Usuários, grupos, roles e políticas organiza objetos, permissões ou atributos de identidades em Keycloak e Authentik, com impacto na concessão e revogação de acessos.","importance":"Permitem estudar autenticação, provedores, grupos, políticas e federação sem depender de produção.","when":"Ao prototipar SSO, conectar aplicações internas e aprender administração de um IdP.","practice":"Crie identidades fictícias e administre usuários, grupos, roles e políticas em plataforma de teste; confira permissões antes e depois.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"Docker; Keycloak ou Authentik (use documentação da versão escolhida).","url":"https://docs.goauthentik.io/"},{"concept":"Integrar aplicações OIDC e SAML integra mecanismos de segurança de federação, autorização ou validação de tokens; examine seu propósito e condições de validade.","importance":"Permitem estudar autenticação, provedores, grupos, políticas e federação sem depender de produção.","when":"Ao prototipar SSO, conectar aplicações internas e aprender administração de um IdP.","practice":"Em fluxo SSO/OIDC/SAML de laboratório, localize integrar aplicações oidc e saml, compare valores válidos e incorretos e observe o comportamento.","verify":"Descreve finalidade, validação obrigatória e resultado de valor inválido.","tools":"Docker; Keycloak ou Authentik (use documentação da versão escolhida).","url":"https://docs.goauthentik.io/"},{"concept":"Logs e troubleshooting de autenticação permite identificar operações, erros e resultados relevantes para autenticação, autorização e integrações IAM.","importance":"Permitem estudar autenticação, provedores, grupos, políticas e federação sem depender de produção.","when":"Ao prototipar SSO, conectar aplicações internas e aprender administração de um IdP.","practice":"Gere eventos de sucesso e falha relacionados a logs e troubleshooting de autenticação no laboratório e compare logs, horários e mensagens.","verify":"Relaciona evidência, causa provável, correção e novo teste.","tools":"Docker; Keycloak ou Authentik (use documentação da versão escolhida).","url":"https://docs.goauthentik.io/"}],[{"concept":"Tenant Entra ID é um conhecimento específico de Microsoft Entra ID. Investigue seu funcionamento técnico, suas dependências e o papel que desempenha no gerenciamento de identidades e acessos.","importance":"É comum em organizações que utilizam Microsoft 365, Azure e aplicações SaaS federadas.","when":"Para centr manecem ativos após mudança ou saída.","when":"Quando RH e diretórios precisam sincronizar contas com aplicações SaaS.","practice":"Crie e desative usuário em API SCIM de laboratório.","verify":"Interpreta id, userName e active.","tools":"SCIM 2.0, Python/REST e IdP compatível.","url":"https://www.rfc-editor.org/rfc/rfc7644"},{"concept":"SCIM Groups organiza objetos, permissões ou atributos de identidades em SCIM e provisionamento JML, com impacto na concessão e revogação de acessos.","importance":"Reduz trabalho manual e ajuda a evitar acessos que permanecem ativos após mudança ou saída.","when":"Quando RH e diretórios precisam sincronizar contas com aplicações SaaS.","practice":"Crie identidades fictícias e administre scim groups em plataforma de teste; confira permissões antes e depois.","verify":"Demonstra concessão, acesso negado e revogação.","tools":"SCIM 2.0, Python/REST e IdP compatível.","url":"https://www.rfc-editor.org/rfc/rfc7644"},{"concept":"REST e SCIM é um conhecimento específico de SCIM e provisionamento JML. Investigue seu funcionamento técnico, suas dependências e o papel que desempenha no gerenciamento de identidades e acessos.","importance":"Reduz trabalho manual e ajuda a evitar acessos que permanecem ativos após mudança ou saída.","when":"Quando RH e diretórios precisam sincronizar contas com aplicações SaaS.","practice":"Em ambiente de teste, configure ou examine rest e scim com dados fictícios, observe uma operação válida e simule um erro de configuração. Documente o resultado.","verify":"Explique como rest e scim funciona, mostre uma evidência reproduzível do laboratório e diagnostique uma falha relacionada.","tools":"SCIM 2.0, Python/REST e IdP compatível.","url":"https://www.rfc-editor.org/rfc/rfc7644"},{"concept":"PATCH é um conhecimento específico de SCIM e provisionamento JML. Investigue seu funcionamento técnico, suas dependências e o papel que desempenha no gerenciamento de identidades e acessos.","importance":"Reduz trabalho manual l com permissões limitadas.","Envie POST /Users com userName, name e active.","Consulte GET /Users e localize o identificador retornado.","Atualize atributo de usuário e desative a conta com active=false.","Compare a conta de destino antes e depois."],"source":"https://www.rfc-editor.org/rfc/rfc7644"},"Conditional Access":{"importance":"Permite condicionar o acesso ao contexto: identidade, aplicação, dispositivo e riscos. Complementa a autenticação e ajuda a exigir MFA ou bloquear situações específicas.","when":"No Microsoft Entra Admin Center → Entra ID → Conditional Access. Algumas condições e recursos exigem licenciamento. É prudente começar usando report-only e contas de emergência separadas.","steps":["Utilize tenant de testes e confirme o licenciamento necessário.","Crie uma política destinada apenas a usuários de laboratório.","Selecione um aplicativo de teste e uma condição de acesso.","Configure o controle desejado e inicie no modo Report-only.","Analise logs de entrada, valide resultados e só depois avalie ativação."],"source":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview"},"RBAC":{"importance":"Reduz concessões individuais e facilita revisão e revogação.","when":"Roles do IdP e autorização de aplicações ou AWS IAM.","steps":["Crie roles Leitor e Editor em app de laboratório","Mapeie ações a roles","Valide que Leitor não pode editar."],"source":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"},"FIDO2 e WebAuthn":{"importance":"Reduz phishing e evita segredos reutilizáveis enviados ao servidor.","when":"Políticas de métodos de autenticação e aplicações com WebAuthn.","steps":["Ative método WebAuthn em IdP isolado","Registre passkey ou chave compatível","Teste login e exclusão da credencial."],"source":"https://pages.nist.gov/800-63-4/sp800-63b.html"},"TCP/IP":{"importance":"AD, LDAP, Kerberos e HTTPS precisam alcançar servidores e portas corretos; rotas e firewalls incorretos frequentemente parecem falhas de login.","when":"Interfaces de rede de Windows Server, Linux, clientes e dispositivos; no Windows Server, Server Manager → Local Server → Ethernet.","steps":["Configure duas VMs na mesma sub-rede isolada","Confira ipconfig /all ou ip addr e a tabela de rotas","Teste TCP 443 com Test-NetConnection após instalar serviço HTTPS e compare com teste de ICMP."],"source":"https://learn.microsoft.com/en-us/windows-server/networking/technologies/network-subsystem/net-sub-interface"},"HTTP e HTTPS":{"importance":"IdPs e aplicações IAM usam HTTPS para login, callbacks, APIs e tokens; certificados inválidos quebram integrações ou expõem dados.","when":"Windows Server → IIS Manager → Sites → Bindings → Add HTTPS/443; ou proxy reverso do Keycloak/Authentik.","steps":["Instale Web Server (IIS) em VM de teste","Associe certificado ao binding HTTPS da porta 443","Teste navegador e curl -I e inspecione validade e nome do certificado."],"source":"https://learn.microsoft.com/en-us/iis/manage/configuring-security/how-to-set-up-ssl-on-iis"},"TLS e certificados":{"importance":"Protege credenciais e tokens durante tráfego LDAP, HTTPS e APIs; cadeia ou hostname inválidos provocam rejeição segura.","when":"Bindings HTTPS em IIS ou proxy reverso; LDAPS no serviço de diretório; gestão de certificados no Windows e Linux.","steps":["Crie certificado de laboratório com nome DNS consistente","Configure HTTPS e examine detalhes no navegador ou openssl s_client","Simule expiração ou nome incorreto em ambiente isolado e observe o erro."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"Usuários e permissões Windows":{"importance":"Conceder privilégio excessivo permite leitura ou alteração indevida de dados usados em processos IAM.","when":"Computer Management → Local Users and Groups e Propriedades → Security da pasta; Windows Server com políticas de domínio também.","steps":["Crie dois usuários locais de laboratório","Crie pasta e atribua leitura a um usuário e gravação a outro","Teste acesso com ambas as contas e analise permissões efetivas."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"Usuários e permissões Linux":{"importance":"Serviços IAM em Linux exigem permissões mínimas para arquivos de configuração, certificados e segredos.","when":"Terminal Linux com useradd/usermod, chown, chmod, id e ls -l.","steps":["Crie usuários e grupo fictícios","Crie arquivo de teste com proprietário e permissões restritas","Tente acessá-lo com conta autorizada e não autorizada."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"Linha de comando (CLI)":{"importance":"Diagnóstico de autenticação requer consultar rede, processos, DNS, certificados e logs com precisão.","when":"PowerShell/Terminal no Windows; shell Bash no Linux.","steps":["Consulte endereço IP, DNS e serviço de teste por terminal","Redirecione saída para arquivo sem dados sensíveis","Documente comando, resultado esperado e retorno observado."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"PowerShell":{"importance":"Administração AD e Entra usa automação para inventário e correção auditável.","when":"Windows PowerShell ou PowerShell 7; módulos de AD em servidores adequados e Microsoft Graph para Entra.","steps":["Execute Get-LocalUser em VM Windows","Filtre contas desabilitadas e exporte CSV de teste","Crie script de consulta sem alterar identidades reais."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"Python básico":{"importance":"Integrações IAM frequentemente requerem transformar atributos e conciliar identidades entre sistemas.","when":"Python em estação isolada, venv e bibliotecas padrão como json/csv/urllib.","steps":["Leia JSON fictício contendo usuários e departamentos","Detecte duplicidade de identificadores","Gere CSV de resultado e trate campos ausentes."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"APIs REST":{"importance":"Entra Graph, SCIM e aplicações IAM expõem operações de ciclo de vida e consulta via APIs.","when":"Endpoints documentados dos sistemas; ferramentas curl, Postman ou PowerShell Invoke-RestMethod.","steps":["Faça GET a API de teste e verifique status e corpo","Envie POST com recurso fictício quando a API permitir","Teste requisição sem autorização e examine 401/403."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"JSON":{"importance":"Atributos, políticas e respostas de provisionamento são frequentemente transportados em JSON.","when":"Corpo de requisições REST, Microsoft Graph, SCIM e claims JWT.","steps":["Monte objeto de usuário com id, active e groups","Valide sintaxe com python -m json.tool","Compare respostas de API com atributos esperados."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"Git":{"importance":"Mudanças em automações IAM precisam rastreabilidade, revisão e capacidade de reversão.","when":"Repositório local ou GitHub sem incluir tokens, senhas ou arquivos secretos.","steps":["Inicialize repositório de laboratório com git init","Faça commit de script de consulta","Altere arquivo, veja git diff e reverta uma mudança de teste."],"source":"https://learn.microsoft.com/en-us/windows-server/"},"Identidade digital":{"importance":"É a origem lógica das contas e políticas de acesso; identidade mal correlacionada gera duplicidades e concessões incorretas.","when":"Cadastro corporativo, diretório AD, Entra e plataforma IGA.","steps":["Modele funcionário e serviço com identificadores distintos","Associe cada identidade às contas em aplicações","Documente atributo que estabelece correlação."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Contas":{"importance":"Uma pessoa pode ter várias contas; inventariá-las permite revogar acesso ao desligar.","when":"AD Users and Computers, Entra ID → Users e administração das aplicações.","steps":["Crie usuário fictício em dois sistemas de laboratório","Relacione contas a uma identidade única","Desative uma conta e observe o alcance da revogação."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Credenciais":{"importance":"Credenciais vazadas permitem autenticação indevida mesmo quando a conta tem permissões limitadas.","when":"Métodos de autenticação do IdP, cofre de segredos e gerenciamento de certificados.","steps":["Liste credenciais permitidas no IdP de teste","Ative um método seguro na conta de laboratório","Revogue-o e teste nova autenticação."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Atributos de identidade":{"importance":"Erros em atributos podem causar provisionamento em grupo ou aplicação errada.","when":"AD Attribute Editor, Entra ID propriedades de usuário, SCIM user schema.","steps":["Crie dois usuários de teste com departamentos distintos","Configure regra baseada em departamento","Altere atributo e confira atualização do acesso."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Autenticação, autorização e auditoria (AAA)":{"importance":"Login bem-sucedido não significa permissão para recursos; logs são necessários para rastreio.","when":"IdP autentica, backend aplica autorização, SIEM/IdP registra eventos.","steps":["Configure aplicação de teste com login e duas roles","Tente recurso restrito com conta sem autorização","Verifique registro de sucesso e negação."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Menor privilégio":{"importance":"Reduz impacto de conta comprometida e abuso interno.","when":"Roles de AD, Entra, AWS IAM, aplicativos e PAM.","steps":["Monte matriz de tarefas e permissões","Retire role administrativa de conta de teste","Confirme que a tarefa permitida funciona e operação excessiva falha."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Zero Trust":{"importance":"Acesso deve considerar identidade, contexto e política mesmo dentro da rede corporativa.","when":"Políticas de acesso condicional, gateways e enforcement em aplicações.","steps":["Desenhe fluxo usuário → IdP → aplicativo","Adicione condição de MFA e dispositivo","Teste acesso dentro e fora das condições."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Joiner (admissão)":{"importance":"Automação evita atraso e acesso não aprovado.","when":"Fluxo RH → IGA/IdP → AD/Entra → aplicação.","steps":["Crie evento fictício de contratação","Mapeie departamento para grupos iniciais","Simule provisionamento e registre aprovação."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Mover (movimentação)":{"importance":"Sem retirada dos direitos anteriores ocorre acúmulo de privilégios.","when":"Fluxos JML e regras de grupos dinâmicos ou IGA.","steps":["Mude usuário fictício de RH para Financeiro","Remova grupo RH antes de conceder grupo novo","Valide permissões resultantes."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Leaver (desligamento)":{"importance":"Contas ativas após desligamento são risco de segurança e auditoria.","when":"HR/IGA, AD, Entra, SCIM, VPN e aplicações.","steps":["Crie checklist de sistemas usados pela identidade fictícia","Desabilite conta e revogue sessão quando disponível","Verifique que login e aplicação estão inacessíveis."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Políticas IAM":{"importance":"Padronizam decisões e permitem demonstrar conformidade.","when":"Políticas corporativas e regras técnicas em IdP, IGA e aplicações.","steps":["Escreva política curta de concessão com dono e aprovador","Estabeleça prazo e revisão","Aplique a solicitação fictícia."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Riscos de identidade":{"importance":"Ajuda priorizar MFA, eliminação de contas órfãs e limitação de privilégio.","when":"Avaliação de risco, sign-in risk e governança de acesso.","steps":["Registre três cenários como senha vazada e admin permanente","Classifique impacto e probabilidade","Associe mitigação concreta a cada um."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"Segregação de funções (SoD)":{"importance":"Uma conta que cria e aprova pagamento concentra risco operacional.","when":"Matrizes de conflitos IGA, RBAC e processos financeiros.","steps":["Crie roles Solicitar e Aprovar","Estabeleça regra de incompatibilidade","Teste pedido de concessão conflitante e bloqueio."],"source":"https://csrc.nist.gov/pubs/sp/800/63/4/final"},"AD DS":{"importance":"Base de identidades Windows em muitas empresas; disponibiliza contas para SSO e controle de acesso.","when":"Windows Server → Server Manager → Add Roles and Features → Active Directory Domain Services.","steps":["Instale AD DS em VM Windows Server isolada","Promova servidor a DC de domínio de laboratório com DNS","Crie conta de teste e valide login em cliente."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Domínio e floresta":{"importance":"Desenho influencia administração, autenticação e limites de confiança.","when":"AD DS em Windows Server e consoles Active Directory Domains and Trusts.","steps":["Desenhe domínio único de laboratório","Consulte nome de domínio e floresta com PowerShell Get-ADForest/Get-ADDomain","Descreva quando precisaria de domínio adicional."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Controladores de domínio":{"importance":"Sem DC alcançável clientes podem enfrentar falhas de login e políticas.","when":"Windows Server com função AD DS; ferramentas dcdiag, repadmin e DNS Manager.","steps":["Identifique DC com nltest /dsgetdc:\u003cdomínio>","Execute dcdiag em laboratório","Observe registros SRV e saúde do serviço."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Organizational Units (OU)":{"importance":"Evita concessão administrativa sobre todo o domínio e organiza políticas.","when":"Active Directory Users and Computers → domínio → New → Organizational Unit.","steps":["Crie OUs Pessoas e Servidores","Mova usuário fictício para OU adequada","Aplique GPO de teste apenas a uma OU."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Usuários do AD":{"importance":"Estado, grupos e atributos da conta determinam acesso e autenticação.","when":"Active Directory Users and Computers ou PowerShell ActiveDirectory.","steps":["Crie usuário de laboratório via New-ADUser","Configure senha inicial segura e habilite conta","Desabilite e teste bloqueio de login."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Grupos do AD":{"importance":"RBAC prático depende de grupos bem definidos e revisão dos membros.","when":"AD Users and Computers → New → Group e membership nas propriedades.","steps":["Crie grupo APP-Leitores","Adicione usuário fictício","Aplique grupo numa ACL de pasta e valide acesso."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"GPO":{"importance":"Padroniza controles de estação e servidor relevantes à segurança de acesso.","when":"Group Policy Management (gpmc.msc) no Windows Server.","steps":["Crie GPO de laboratório vinculada à OU","Configure política não destrutiva","Em cliente execute gpupdate e gpresult /r."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Delegação administrativa":{"importance":"Reduz uso de Domain Admin e segmenta responsabilidades.","when":"AD Users and Computers → OU → Delegate Control.","steps":["Crie grupo Helpdesk-Lab","Delegue reset de senhas só numa OU","Teste operação dentro e fora do escopo."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Tickets Kerberos":{"importance":"Tipos e validade dos tickets são úteis no diagnóstico de SSO e expiração.","when":"Windows klist e logs Kerberos do DC.","steps":["Examine klist após login","Acesse recurso SMB de laboratório","Compare TGT e ticket CIFS obtido."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Service Principal Names (SPN)":{"importance":"SPN duplicado ou inexistente pode impedir autenticação Kerberos de aplicação.","when":"Comando setspn e atributos servicePrincipalName no AD.","steps":["Consulte setspn -L de conta de serviço fictícia","Liste registros no domínio com setspn -Q","Documente nome de serviço esperado sem alterar produção."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Troubleshooting com DNS e Event Viewer":{"importance":"Problema aparente de senha pode ser falta de DC, DNS ou relógio correto.","when":"DNS Manager, Event Viewer e Windows PowerShell no domínio.","steps":["Use nslookup para consultar registros do DC","Examine Security/System em Event Viewer","Corrija resolução na VM e refaça login."],"source":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"},"Distinguished Name (DN)":{"importance":"Bind e buscas precisam identificar corretamente onde está o objeto.","when":"Estrutura de AD, OpenLDAP e clientes LDAP.","steps":["Localize DN de usuário no AD ou ldapsearch","Decomponha CN/OU/DC","Mova objeto de OU em laboratório e observe mudança."],"source":"https://www.openldap.org/doc/admin26/"},"Filtros LDAP":{"importance":"Integrações usam filtros para restringir usuários e grupos sincronizados.","when":"Configuração de busca dos conectores LDAP, AD e OpenLDAP.","steps":["Crie usuários fictícios de departamentos diferentes","Busque com (department=TI) e filtro AND","Confira que apenas objetos esperados aparecem."],"source":"https://www.openldap.org/doc/admin26/"},"LDAPS":{"importance":"Impede exposição de credenciais e dados de diretório na rede.","when":"Certificado do servidor LDAP/AD e configuração do cliente para TLS.","steps":["Configure certificado de laboratório no servidor","Conecte por LDAPS e valide cadeia","Teste cliente que não confia no certificado."],"source":"https://www.openldap.org/doc/admin26/"},"Atributos e esquema de diretório":{"importance":"Mapeamentos corretos permitem autenticar e provisionar sem conflitos de dados.","when":"AD Schema/Attribute Editor e OpenLDAP subschema.","steps":["Inspecione object
