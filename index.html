ação de contas, grupos, computadores e regras de segurança.","Em ambientes Windows locais ou híbridos com sistemas integrados ao domínio.","Em VMs isoladas, instale um domínio de teste; crie OU, grupos e usuários; aplique uma GPO e confira o resultado.","Windows Server AD DS, PowerShell e Event Viewer.","https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/"],["LDAP é um protocolo para consultar e modificar informações em serviços de diretório; LDAPS protege a conexão com TLS.","Permite integrar aplicações a contas e atributos corporativos existentes.","Quando uma aplicação precisa localizar usuários ou validar identidades via diretório.","Crie diretório de laboratório; consulte um usuário por filtro LDAP e analise DN e atributos sem expor credenciais.","OpenLDAP ou Active Directory, ldapsearch.","https://www.openldap.org/doc/admin26/"],["Autorização decide o que um usuário autenticado pode fazer. RBAC usa papéis; ABAC considera atributos e contexto.","Impede que um login válido se transforme em acesso irrestrito.","Quando há departamentos, níveis de responsabilidade ou dados de confidencialidade distinta.","Crie papéis Leitor, Editor e Administrador em app de teste; execute uma operação permitida e outra negada.","Keycloak para roles + aplicação que valide as permissões no servidor.","https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"],["MFA combina fatores de autenticação; passkeys usam criptografia de chave pública e podem resistir a phishing quando implementadas corretamente.","Dificulta acesso indevido após vazamento ou reutilização de senhas.","Em aplicações empresariais, acessos administrativos e operações sensíveis.","Habilite TOTP no IdP de laboratório; teste login com segundo fator e acesso sem concluí-lo.","Keycloak ou Microsoft Entra ID; autenticador compatível.","https://pages.nist.gov/800-63-4/sp800-63b.html"],["SSO (Single Sign-On) permite ao usuário se autenticar num provedor de identidade e acessar várias aplic ocumentação da versão escolhida).","https://docs.goauthentik.io/"],["Microsoft Entra ID gerencia identidades e acesso a aplicações e recursos em nuvem.","É comum em organizações que utilizam Microsoft 365, Azure e aplicações SaaS federadas.","Para centralizar login empresarial, configurar MFA, aplicações e acesso condicional.","Num tenant de teste, crie grupo e usuário, atribua aplicação empresarial e revise logs de entrada; teste políticas em modo de relatório quando disponível.","Portal Microsoft Entra, Microsoft Graph; alguns recursos exigem licença.","https://learn.microsoft.com/en-us/entra/identity/"],["Cloud IAM permite conceder permissões a pessoas e workloads em ambientes de nuvem, normalmente usando roles e credenciais temporárias.","Reduz credenciais estáticas e privilégios excessivos nos serviços cloud.","Ao usar AWS, Azure, automações e pipelines que acessam APIs e recursos.","Na AWS, crie uma role de leitura com policy restrita, assuma-a em ambiente de teste e compare uma ação autorizada com outra negada.","AWS IAM e STS; no Azure, managed identities.","https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html"],["SCIM é um padrão de API para criação, atualização e desativação de identidades; JML organiza admissão, movimentação e desligamento.","Reduz trabalho manual e ajuda a evitar acessos que permanecem ativos após mudança ou saída.","Quando RH e diretórios precisam sincronizar contas com aplicações SaaS.","Use usuários fictícios e uma API SCIM de laboratório; crie conta, modifique departamento e marque-a como inativa; reconcilie os resultados.","SCIM 2.0, Python/REST e IdP compatível.","https://www.rfc-editor.org/rfc/rfc7644"],["IGA significa governança e administração de identidades: quem aprova o acesso, por que existe e quando deve ser revogado.","Oferece rastreabilidade, revisão periódica e controle de conflitos de funções.","Em auditorias, revisão de acessos, mudanças de cargo e gestão de permissões críticas.","Crie um catálogo de perm
