:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important;background:#04070a!important;color:#e7f0f8!important;--azul elétrico:#1b86f2;--azul elétrico-bright:#94c1ef;--muted:#1e88f2}

const atlasCertLegend=()=>'<section class="atlas-cert-guide" aria-label="Como priorizar certificações"><div class="atlas-cert-guide-title"><span class="atlas-section-eyebrow">CRITÉRIO DE PRIORIDADE</span><h3>Qual certificação vale a pena para você?</h3><p>Os selos indicam relevância para a trajetória profissional, <strong>não uma exigência oficial de contratação</strong>. Nenhuma certificação é obrigatória para toda vaga IAM.</p></div><div class="atlas-cert-legend-grid"><div><span class="cert-priority priority-essential">Essencial</span><p><strong>Prioridade alta para a trilha indicada.</strong> Ex.: SC-300 para quem pretende trabalhar com Microsoft Entra.</p></div><div><span class="cert-priority priority-recommended">Recomendada</span><p><strong>Agrega valor de acordo com o momento e a especialização.</strong> Ex.: SC-900 para começar ou credenciais de uma plataforma usada no trabalho.</p></div><div><span class="cert-priority priority-optional">Opcional</span><p><strong>Complementa o currículo.</strong> Não substitui conhecimentos práticos nem precisa ser feita por todos.</p></div></div><p class="atlas-cert-guide-note">Para começar: escolha uma base introdutória (SC-900, ISC2 CC ou estudo equivalente), construa laboratórios e só então selecione a certificação ligada à sua especialização. Consulte os requisitos de cada fabricante.</p></section>';

function drawTopics(){const field=document.getElementById('search');if(!field)return;const q=field.value.toLowerCase().trim();document.getElementById('topic-results').innerHTML=levels.map((l,i)=>{const list=topics.filter(t=>t.level===i&&(t.title+' '+t.desc).toLowerCase().includes(q)&&(topicFilter==='todos'||(topicFilter==='concluidos'?completed.has(t.id):!completed.has(t.id))));return list.length?'<section class="roadmap-level"><h2>0'+(i+1)+' · '+l+'</h2><div class="list">'+list.map(t=>'<article class="topic-shell"><button class="topic" data-expand-topic="'+t.id+'" aria-expanded="false" aria-controls="topic-panel-'+t.id+'"><span><strong>'+t.title+'</strong><small>'+t.desc+'</small><small>↳ Atlas Corp · Etapa '+(t.level+1)+' · '+(window.IAMAtlasCurriculum?.lessons?.[t.id]?.estimated||'Estudo guiado')+'</small></span><span class="topic-indicator">'+(completed.has(t.id)?'✓':'＋')+'</span></button><div class="topic-panel" id="topic-panel-'+t.id+'"><div class="topic-panel-inner"><div class="topic-detail-inner">'+atlasLessonHtml(t)+'<div class="topic-actions"><a href="'+t.url+'" target="_blank" rel="noopener noreferrer">Referência oficial ↗</a><button type="button" class="atlas-btn atlas-btn-secondary atlas-practice-link" data-atlas-lab-stage="'+(window.IAMAtlasCurriculum.lessons[t.id]?.labStage??0)+'">'+atlasIcon('flask')+' Aplicar no laboratório</button><button class="primary" data-complete-topic="'+t.id+'">'+(completed.has(t.id)?'✓ Concluído · Desmarcar':'Marcar como concluído')+'</button></div></div></div></div></article>').join('')+'</div></section>':''}).join('')||'<div class="empty">Nenhum tópico encontrado.</div>'}
function open(kind,n){let x,title,body='',id;
if(kind==='topic'){x=topics[n];title=x.title;id=x.id;body='<p>'+x.desc+'</p><h3>Aplicação no laboratório Atlas Corp · Etapa '+(x.level+1)+'</h3><p>'+labPlan[x.level].join(' · ')+'</p><h3>Exercício prático</h3><p>'+x.practice+'</p><h3>Documentação</h3><p><a target="_blank" rel="noopener noreferrer" href="'+x.url+'">Consultar referência oficial ↗</a></p>'}
if(kind==='stage'){title='Etapa '+(n+1)+' · '+levels[n];body='<p>Reutilize o ambiente Atlas Corp construído nas etapas anteriores.</p><h3>Implementação prática</h3><ol>'+labPlan[n].map(t=>'<li>'+t+'</li>').join('')+'</ol><h3>Temas desta etapa</h3><ul>'+topics.filter(t=>t.level===n).map(t=>'<li>'+t.title+'</li>').join('')+'</ul><p>Entregável: configurações, diagramas e evidências documentadas.</p>'}

document.getElementById('detail-body').innerHTML='<span class="eyebrow">IAM ATLAS</span><h2>'+title+'</h2>'+body+(id?'<button class="primary" id="mark" data-item="'+id+'">'+(completed.has(id)?'✓ Concluído · Desmarcar':'Marcar como concluído')+'</button>':'');atlasOpenDialog();}
document.addEventListener('click',e=>{
const practice=e.target.closest('[data-atlas-lab-stage]');if(practice){const index=Number(practice.dataset.atlasLabStage);if(Number.isInteger(index)&&index>=0&&index<window.IAMAtlasCurriculum.environment.stages.length){try{sessionStorage.setItem('atlas-active-lab-entra-v2',String(index))}catch{}if(location.hash==='#labs'){atlasEnvOpen(index,true)}else location.hash='#labs'}return}

const command=e.target.closest('[data-env-copy]');if(command){
const code=command.closest('.atlas-env-command')?.querySelector('code')?.textContent;if(!code)return;
const copied=()=>{command.textContent='✓ Copiado';setTimeout(()=>{if(command.isConnected)command.innerHTML=atlasIcon('check')+' Copiar'},1600)};const fallback=()=>{const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(command.closest('.atlas-env-command').querySelector('code'));selection.removeAllRanges();selection.addRange(range);try{if(document.execCommand('copy'))copied();else alert('O comando está selecionado. Pressione Ctrl+C para copiar.')}catch{alert('O comando está selecionado. Pressione Ctrl+C para copiar.')}finally{selection.removeAllRanges()}};if(navigator.clipboard?.writeText){navigator.clipboard.writeText(code).then(copied).catch(fallback)}else fallback()
return;
}
const envToggle=e.target.closest('[data-env-toggle]');if(envToggle){const index=Number(envToggle.dataset.envToggle),section=envToggle.closest('.atlas-env-stage');if(section.classList.contains('is-open')){section.classList.remove('is-open');envToggle.setAttribute('aria-expanded','false')}else atlasEnvOpen(index);return}

const filterButton=e.target.closest('[data-topic-filter]');if(filterButton){topicFilter=filterButton.dataset.topicFilter;document.querySelectorAll('[data-topic-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filterButton)));drawTopics();return}const toggle=e.target.closest('[data-expand-topic]');if(toggle){const shell=toggle.closest('.topic-shell'),old=document.querySelector('.topic-shell.is-open');if(old&&old!==shell){old.classList.remove('is-open');old.querySelector('.topic').setAttribute('aria-expanded','false');old.querySelector('.topic-panel').classList.remove('expanded')}const open=shell.classList.toggle('is-open');toggle.setAttribute('aria-expanded',String(open));shell.querySelector('.topic-panel').classList.toggle('expanded',open);return}const complete=e.target.closest('[data-complete-topic]');if(complete){const id=complete.dataset.completeTopic;completed.has(id)?completed.delete(id):completed.add(id);localStorage.setItem(KEY,JSON.stringify([...completed]));complete.textContent=completed.has(id)?'✓ Concluído · Desmarcar':'Marcar como concluído';complete.closest('.topic-shell').querySelector('.topic-indicator').textContent=completed.has(id)?'✓':'＋';if(topicFilter!=='todos')drawTopics();return}const page=e.target.closest('[data-page]');if(page){if(location.hash!=='#'+page.dataset.page)location.hash=page.dataset.page;else{render();window.scrollTo({top:0,behavior:'smooth'})}return}const item=e.target.closest('[data-kind]');if(item)open(item.dataset.kind,Number(item.dataset.id));if(e.target.closest('[data-stage]')){const b=e.target.closest('[data-stage]');drawCerts(b.getAttribute('aria-expanded')==='true'?'':b.dataset.stage)}if(e.target.id==='mark'){const id=e.target.dataset.item;completed.has(id)?completed.delete(id):completed.add(id);localStorage.setItem(KEY,JSON.stringify([...completed]));atlasCloseDialog();render()}if(e.target.id==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify({app:'iam-atlas',version:2,completed:[...completed document.addEventListener('change',async e=>{const step=e.target.closest('[data-atlas-step-id]');if(step){const id=step.dataset.atlasStepId,index=step.dataset.atlasStep;const existing=atlasChecklist[id]||{};existing[index]=step.checked;atlasChecklist[id]=existing;localStorage.setItem(ATLAS_CHECKLIST_KEY,JSON.stringify(atlasChecklist));const counter=document.querySelector('[data-atlas-step-count="'+id+'"]');if(counter){const total=document.querySelectorAll('[data-atlas-step-id="'+id+'"]').length;counter.textContent=atlasStepCount(id)+' de '+total+' etapas praticadas'}if(id.startsWith('env')){const n=Number(id.slice(3)),stage=window.IAMAtlasCurriculum.environment.stages[n],p=atlasLabProgress(stage,n),section=document.getElementById('env-stage-'+n);if(section){section.querySelector('.atlas-env-status>span:first-child').textContent=p.count+'/'+p.total+' tarefas';section.querySelector('.atlas-env-mini-track i').style.width=p.pct+'%';section.querySelector('[data-env-counter]').textContent=p.count+' de '+p.total+' tarefas realizadas'}const totalSteps=window.IAMAtlasCurriculum.environment.stages.reduce((a,t)=>a+t.steps.length,0),doneSteps=window.IAMAtlasCurriculum.environment.stages.reduce((a,t,i)=>a+atlasLabProgress(t,i).count,0),summary=document.querySelector('.atlas-env-summary');if(summary){summary.querySelector('strong').textContent=Math.round(100*doneSteps/totalSteps)+'%';summary.querySelector('.atlas-compact-track i').style.width=Math.round(100*doneSteps/totalSteps)+'%';summary.querySelector('span').textContent=doneSteps+' de '+totalSteps+' tarefas'}}return}if(e.target.id==='file'){try{const f=e.target.files[0];if(!f||f.size>100000)throw Error('Arquivo inválido');const data=JSON.parse(await f.text());if(data.app!=='iam-atlas'||!Array.isArray(data.completed)||!data.completed.every(x=>ids.includes(x)))throw Error('Formato incompatível');if(confirm('Substituir o progresso atual?')){completed=new Set(data.completed);localStorage.setItem(KEY,JSON.stringify([...completed]));if(data.checklists&&typeof data.checklists==='object'&&!Array.isArray(data.checklists)){atlasChecklist=Object.fromEntries(Object.entries(data.checklists).filter(([id,steps])=>(ids.includes(id)||/^env\d{1,2}$/.test(id)&&Number(id.slice(3))<window.IAMAtlasCurriculum.environment.stages.length)&&steps&&typeof steps==='object'&&!Array.isArray(steps)).map(([id,steps])=>[id,Object.fromEntries(Object.entries(steps).filter(([k,v])=>/^[0-9]{1,2}$/.test(k)&&typeof v==='boolean'))]));localStorage.setItem(ATLAS_CHECKLIST_KEY,JSON.stringify(atlasChecklist))}else{atlasChecklist={};localStorage.removeItem(ATLAS_CHECKLIST_KEY)}render()}}catch(err){alert('Falha ao importar: '+err.message)}}});
/* Modal motion is explicitly driven by Web Animations API, not CSS on [open].
   This prevents an instant native dialog paint and guarantees a visible transition. */
let atlasDialogAnimation=null;
const atlasDialogReduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function atlasDialogAnimate(keyframes,options){
if(!dialog.animate||atlasDialogReduced())return Promise.resolve();
atlasDialogAnimation?.cancel();
const animation=dialog.animate(keyframes,{fill:'both',...options});
atlasDialogAnimation=animation;
return animation.finished.catch(()=>{}).then(()=>{if(atlasDialogAnimation===animation){animation.cancel();atlasDialogAnimation=null}});
}
function atlasOpenDialog(){
if(dialog.open){atlasDialogAnimation?.cancel();return}
dialog.showModal();
dialog.classList.add('atlas-dialog-motion');
dialog.style.opacity='0';
dialog.style.transform='translateY(28px) scale(.94)';
requestAnimationFrame(()=>{
if(!dialog.open)return;
dialog.style.opacity='';
dialog.style.transform='';
atlasDialogAnimate([
{opacity:0,transform:'perspective(900px) translateY(42px) rotateX(-5deg) scale(.93)',filter:'blur(6px)'},
{opacity:1,transform:'perspective(900px) translateY(-3px) rotateX(0deg) scale(1.008)',filter:'blur(0)',offset:.78},
{opacity:1,transform:'perspective(900px) translateY(0) rotateX(0deg) scale(1)',filter:'blur(0)'}
],{duration:560,easing:'cubic-bezier(.18,.85,.22,1)'}).then(()=>{if(dialog.open)dialog.classList.remove('atlas-dialog-motion')});
});
}
function atlasCloseDialog(){
if(!dialog.open)return;
dialog.classList.remove('atlas-dialog-motion');
if(atlasDialogReduced()||!dialog.animate){atlasDialogAnimation?.cancel();dialog.close();return}
atlasDialogAnimate([
{opacity:1,transform:'translateY(0) scale(1)'},
{opacity:0,transform:'translateY(22px) scale(.96)'}
],{duration:250,easing:'cubic-bezier(.45,0,.9,.4)'}).then(()=>{if(dialog.open)dialog.close()});
}
document.getElementById('close').onclick=atlasCloseDialog;
dialog.addEventListener('click',event=>{if(event.target===dialog)atlasCloseDialog()});
dialog.addEventListener('cancel',event=>{event.preventDefault();atlasCloseDialog()});
document.addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--px',(e.clientX-r.left)+'px');c.style.setProperty('--py',(e.clientY-r.top)+'px')},{passive:true});let transitionTimer=0;function transitionPage(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){render();return}clearTimeout(transitionTimer);app.classList.add('is-leaving');transitionTimer=setTimeout(()=>{app.classList.remove('is-leaving');render();window.scrollTo({top:0,behavior:'instant'})},175)}window.addEventListener('hashchange',transitionPage);render();
