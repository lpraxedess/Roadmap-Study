/* IAM Atlas · editorial dark / electric violet */
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important;background:#06050b!important;color:#f7f5ff!important;--violet:#8959ff;--violet-bright:#ae87ff;--muted:#aaa5bb}

body{min-height:100vh;background:radial-gradient(ellipse 60% 30% at 51% 0%,#35145a44,transparent 85%),linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px),#06050b!important;background-size:auto,52px 52px,52px 52px,auto!important;color:#f7f5ff!important}

aside strong:before{content:"✦";color:#a780ff;font-size:22px;margin-right:11px;text-shadow:0 0 17px #a16dff9c}
aside button{flex:none;text-align:center!important;border-radius:12px!important;padding:12px 16px!important;color:#aaa6bc!important;font-size:13px;font-weight:600;transition:color .3s,background .3s,box-shadow .3s,transform .3s}
aside button.active,aside button:hover{color:#fff!important;background:#ffffff10!important;box-shadow:none!important;transform:translateY(-1px)}

main{max-width:1230px!important;margin:0 auto!important;padding:72px clamp(18px,4vw,60px) 95px!important;min-height:calc(100vh - 100px)}
header{max-width:930px;margin:0 auto 48px!important;text-align:center;position:relative}

.grid{gap:19px!important}

.cert-level:hover,.cert-level.selected{background:#8a4aff14!important;color:#e4d5ff!important}

const ids=[...topics,...labs,...certs].map(x=>x.id);const KEY='iam-atlas-v1';let completed=new Set();try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))completed=new Set(data.filter(x=>ids.includes(x)))}catch{}const app=document.getElementById('app'),dialog=document.getElementById('detail');const pct=arr=>arr.length?Math.round(arr.filter(x=>completed.has(x.id)).length/arr.length*100):0;const meter=n=>'<div class="meter"><span style="width:'+n+'%"></span></div>';const head=(k,t,d)=>'<header><span class="eyebrow">'+k+'</span><h1>'+t+'</h1><p class="lead">'+d+'</p></header>';const card=(s)=>'<div class="card">'+s+'</div>';const group=(s)=>'<div class="grid">'+s+'</div>';const heading=(s)=>'<h2>'+s+'</h2>';const st=()=>group(card('<span class="muted">Roadmap concluído</span><div class="number">'+pct(topics)+'%</div>'+meter(pct(topics)))+card('<span class="muted">Tópicos</span><div class="number">'+topics.filter(x=>completed.has(x.id)).length+' / '+topics.length+'</div>')+card('<span class="muted">Laboratórios</span><div class="number">'+levels.filter((_,i)=>topics.filter(t=>t.level===i).every(t=>completed.has(t.id))).length+' / '+levels.length+'</div>')+card('<span class="muted">Certificações registradas</span><div class="number">'+certs.filter(x=>completed.has(x.id)).length+' / '+certs.length+'</div>'));
function render(){const requested=(location.hash.slice(1)||'inicio');const page=['labs','progresso','trilhas'].includes(requested)?'inicio':requested;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let out='';
if(page==='inicio')out=head('PLATAFORMA EDUCACIONAL','Sua carreira em <span style="color:#cede62">Identity & Access Management</span>','Aprenda do zero à arquitetura com fundamentos, atividades práticas, especializações e fontes oficiais. Sua evolução é salva no navegador.')+st()+heading('Como estudar')+group(card('<span class="tag">01 · APRENDA</span><h3>Entenda os fundamentos</h3><p>Leia os objetivos de cada tópico e consulte as fontes recomendadas.</p>')+card('<span class="tag">02 · APLIQUE</span><h3>Resolva laboratórios</h3><p>Transforme os conceitos em diagramas, políticas e documentação de portfólio.</p>')+card('<span class="tag">03 · EVOLUA</span><h3>Meça seu progresso</h3><p>Marque competências concluídas e construa um laboratório contínuo.</p>'))+'<div class="dashboard-banner"><div class="banner-copy"><span class="banner-kicker">SEU PRÓXIMO PASSO</span><h2>Construa sua evolução em IAM, uma competência por vez.</h2><p>Explore as trilhas, desenvolva seu laboratório e acompanhe cada conquista.</p></div><button data-page="roadmap">Explorar roadmap ↗</button></div>'+'<div class="note">Comece pelo roadmap. Os laboratórios devem ser feitos apenas em ambientes autorizados.</div>';
else if(page==='roadmap')out=head('6 NÍVEIS · 25 TÓPICOS','Roadmap completo','Os tópicos constroem progressivamente o mesmo ambiente fictício Atlas Corp. Aplique cada conceito antes de avançar.')+'<input id="search" class="filter" placeholder="Buscar por assunto ou tecnologia..." aria-label="Buscar tópicos"><div id="topic-results"></div>';
else if(page==='certs')out=head('CERTIFICAÇÕES','Certificações IAM','Uma jornada de aprendizado, do fundamento à arquitetura. Selecione um nível para explorar as credenciais.')+'<div class="cert-stack">'+['Básica','Intermediária','Avançada'].map(v=>'<section class="cert-row"><button class="cert-level" data-stage="'+v+'" aria-expanded="false"><span>'+v+'</span><span class="chevron">↗</span></button><div class="cert-row-body"></div></section>').join('')+'</div>';
else if(page==='progresso')out=head('SEU APRENDIZADO','Meu progresso','Seus dados ficam neste navegador. Exporte um backup para mudar de dispositivo.')+st()+heading('Progresso por nível')+group(levels.map((l,i)=>card('<h3>'+l+'</h3>'+meter(pct(topics.filter(t=>t.level===i)))+'<span class="muted">'+pct(topics.filter(t=>t.level===i))+'% concluído</span>')).join(''))+'<div class="toolbar"><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><button id="reset">Limpar progresso</button><input hidden id="file" type="file" accept=".json,application/json"></div>';
else {location.hash='#inicio';return}app.innerHTML=out+'<footer>IAM Atlas · Guia independente · '+new Date().getFullYear()+' · Confirme sempre os requisitos atuais com os fabricantes.</footer>';if(page==='roadmap'){drawTopics();document.getElementById('search').addEventListener('input',drawTopics)}if(page==='certs')drawCerts('')}
function certPriority(c){return completed.has(c.id)?'done':c.name==='Microsoft SC-300'?'required':['Microsoft SC-900','Microsoft SC-100'].includes(c.name)?'essential':'optional'}
function drawCerts(stage){document.querySelectorAll('.cert-row').forEach(row=>{const b=row.querySelector('.cert-level'),open=b.dataset.stage===stage,body=row.querySelector('.cert-row-body');b.classList.toggle('selected',open);b.setAttribute('aria-expanded',String(open));if(open&&!body.firstElementChild){body.innerHTML='<div class="cert-body-inner">'+certs.map((c,i)=>({...c,index:i})).filter(c=>c.stage===stage).map(c=>'<button class="cert-tile '+certPriority(c)+'" data-kind="cert" data-id="'+c.index+'"><span class="cert-dot"></span><span class="cert-info"><strong>'+c.name+'</strong><small>'+c.provider+'</small></span><span class="cert-arrow">↗</span></button>').join('')+'</div>'}body.classList.toggle('expanded',open)})}
let activeTopic=null;
function drawTopics(){const field=document.getElementById('search');if(!field)return;const q=field.value.toLowerCase().trim();document.getElementById('topic-results').innerHTML=levels.map((l,i)=>{const list=topics.filter(t=>t.level===i&&(t.title+' '+t.desc).toLowerCase().includes(q));return list.length?'<section class="roadmap-level"><h2>0'+(i+1)+' · '+l+'</h2><div class="list">'+list.map(t=>'<article class="topic-shell"><button class="topic" data-expand-topic="'+t.id+'" aria-expanded="false"><span><strong>'+t.title+'</strong><small>'+t.desc+'</small><small>↳ Atlas Corp · Etapa '+(t.level+1)+'</small></span><span class="topic-indicator">'+(completed.has(t.id)?'✓':'＋')+'</span></button><div class="topic-panel"><div class="topic-panel-inner"><div class="topic-detail-inner"><div class="detail-columns"><section><span class="detail-label">01 · APRENDER</span><h3>O que aprender</h3><p>'+t.desc+'</p></section><section><span class="detail-label">02 · APLICAR</span><h3>Aplicação em laboratório</h3><ol>'+labPlan[t.level].map(x=>'<li>'+x+'</li>').join('')+'</ol></section><section><span class="detail-label">03 · PRATICAR</span><h3>Exercício prático</h3><p>'+t.practice+'</p></section></div><div class="topic-actions"><a href="'+t.url+'" target="_blank" rel="noopener noreferrer">Documentação oficial ↗</a><button class="primary" data-complete-topic="'+t.id+'">'+(completed.has(t.id)?'✓ Concluído · Desmarcar':'Marcar como concluído')+'</button></div></div></div></div></article>').join('')+'</div></section>':''}).join('')||'<div class="empty">Nenhum tópico encontrado.</div>'}
function open(kind,n){let x,title,body='',id;
if(kind==='topic'){x=topics[n];title=x.title;id=x.id;body='<p>'+x.desc+'</p><h3>Aplicação no laboratório Atlas Corp · Etapa '+(x.level+1)+'</h3><p>'+labPlan[x.level].join(' · ')+'</p><h3>Exercício prático</h3><p>'+x.practice+'</p><h3>Documentação</h3><p><a target="_blank" rel="noopener noreferrer" href="'+x.url+'">Consultar referência oficial ↗</a></p>'}
if(kind==='stage'){title='Etapa '+(n+1)+' · '+levels[n];body='<p>Reutilize o ambiente Atlas Corp construído nas etapas anteriores.</p><h3>Implementação prática</h3><ol>'+labPlan[n].map(t=>'<li>'+t+'</li>').join('')+'</ol><h3>Temas desta etapa</h3><ul>'+topics.filter(t=>t.level===n).map(t=>'<li>'+t.title+'</li>').join('')+'</ul><p>Entregável: configurações, diagramas e evidências documentadas.</p>'}

if(kind==='track'){x=tracks[n];title=x.name;body='<p>'+x.desc+'</p><h3>Competências recomendadas</h3><ol>'+x.ids.map(i=>'<li>'+topics[i].title+(completed.has(topics[i].id)?' ✓':'')+'</li>').join('')+'</ol><p>Concluído: '+pct(x.ids.map(i=>topics[i]))+'%</p>'; }
document.getElementById('detail-body').innerHTML='<span class="eyebrow">IAM ATLAS</span><h2>'+title+'</h2>'+body+(id?'<button class="primary" id="mark" data-item="'+id+'">'+(completed.has(id)?'✓ Concluído · Desmarcar':'Marcar como concluído')+'</button>':'');dialog.showModal()}
document.addEventListener('click',e=>{const toggle=e.target.closest('[data-expand-topic]');if(toggle){const shell=toggle.closest('.topic-shell'),old=document.querySelector('.topic-shell.is-open');if(old&&old!==shell){old.classList.remove('is-open');old.querySelector('.topic').setAttribute('aria-expanded','false');old.querySelector('.topic-panel').classList.remove('expanded')}const open=shell.classList.toggle('is-open');toggle.setAttribute('aria-expanded',String(open));shell.querySelector('.topic-panel').classList.toggle('expanded',open);return}const complete=e.target.closest('[data-complete-topic]');if(complete){const id=complete.dataset.completeTopic;completed.has(id)?completed.delete(id):completed.add(id);localStorage.setItem(KEY,JSON.stringify([...completed]));complete.textContent=completed.has(id)?'✓ Concluído · Desmarcar':'Marcar como concluído';complete.closest('.topic-shell').querySelector('.topic-indicator').textContent=completed.has(id)?'✓':'＋';return}const page=e.target.closest('[data-page]');if(page){if(location.hash!=='#'+page.dataset.page)location.hash=page.dataset.page;else render();return}const item=e.target.closest('[data-kind]');if(item)open(item.dataset.kind,Number(item.dataset.id));if(e.target.closest('[data-stage]')){const b=e.target.closest('[data-stage]');drawCerts(b.getAttribute('aria-expanded')==='true'?'':b.dataset.stage)}if(e.target.id==='mark'){const id=e.target.dataset.item;completed.has(id)?completed.delete(id):completed.add(id);localStorage.setItem(KEY,JSON.stringify([...completed]));dialog.close();render()}if(e.target.id==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify({app:'iam-atlas',completed:[...completed]},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='iam-atlas-progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(e.target.id==='import')document.getElementById('file').click();if(e.target.id==='reset'&&confirm('Apagar todas as marcações?')){completed.clear();localStorage.setItem(KEY,'[]');render()}});
document.addEventListener('change',async e=>{if(e.target.id==='file'){try{const f=e.target.files[0];if(!f||f.size>100000)throw Error('Arquivo inválido');const data=JSON.parse(await f.text());if(data.app!=='iam-atlas'||!Array.isArray(data.completed)||!data.completed.every(x=>ids.includes(x)))throw Error('Formato incompatível');if(confirm('Substituir o progresso atual?')){completed=new Set(data.completed);localStorage.setItem(KEY,JSON.stringify([...completed]));render()}}catch(err){alert('Falha ao importar: '+err.message)}}});
