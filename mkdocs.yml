      - "01 hybrid recovery": projetos/01-hybrid-recovery.md
      - "02 sso federation": projetos/02-sso-federation.md
      - "03 jml engineering": projetos/03-jml-engineering.md
      - "04 governance": projetos/04-governance.md
      - "05 itdr": projetos/05-itdr.md
      - "06 enterprise architecture": projetos/06-enterprise-architecture.md
  - Referências:
      - Portfólio: portfolio.md
      - Publicação: publicacao.md
docs_dir: docs
